<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dressing & Beauty Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="painted-bg" aria-hidden="true">
    <svg viewBox="0 0 1600 950" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f9e3dc"/><stop offset=".45" stop-color="#eee5f6"/><stop offset="1" stop-color="#dfecef"/>
        </linearGradient>
        <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#cbdce2"/><stop offset=".5" stop-color="#f8e0d8"/><stop offset="1" stop-color="#cbd8d5"/>
        </linearGradient>
        <filter id="softBlur"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>
      <rect width="1600" height="950" fill="url(#sky)"/>
      <circle cx="1180" cy="120" r="135" fill="#f6d7a7" opacity=".45" filter="url(#softBlur)"/>
      <path d="M0 340 C230 190 365 280 520 210 C710 125 860 230 1040 160 C1240 80 1390 130 1600 80 L1600 530 L0 530Z" fill="#c9d7d6" opacity=".38"/>
      <path d="M0 410 C270 305 460 395 650 300 C850 215 1010 350 1220 255 C1380 185 1490 210 1600 170 L1600 560 L0 560Z" fill="#b9c6c8" opacity=".34"/>
      <path d="M875 335 l95 -80 l118 80 v95 h-213z" fill="#d1aaa0" opacity=".75"/>
      <path d="M850 333 q140 -92 280 0 q-138 -42 -280 0z" fill="#8b6d68" opacity=".55"/>
      <rect x="928" y="357" width="110" height="73" rx="8" fill="#f0dcd3" opacity=".66"/>
      <path d="M0 650 C220 585 360 690 545 625 C775 545 980 655 1190 600 C1375 553 1460 610 1600 575 L1600 950 L0 950Z" fill="url(#river)" opacity=".72"/>
      <path d="M0 725 C260 660 440 770 650 710 C840 655 1010 740 1240 690 C1390 657 1490 695 1600 660" stroke="#fff7ef" stroke-width="10" opacity=".25" fill="none"/>
      <path d="M215 560 C425 455 720 455 980 555" stroke="#795b4e" stroke-width="22" fill="none" opacity=".63"/>
      <path d="M220 535 C430 430 720 430 990 530" stroke="#b98b78" stroke-width="10" fill="none" opacity=".64"/>
      <g opacity=".5"><line x1="330" y1="510" x2="330" y2="585" stroke="#72544c" stroke-width="7"/><line x1="525" y1="470" x2="525" y2="565" stroke="#72544c" stroke-width="7"/><line x1="725" y1="480" x2="725" y2="580" stroke="#72544c" stroke-width="7"/></g>
      <g transform="translate(365 570)" opacity=".82">
        <path d="M75 30 C45 60 40 108 50 160 L108 160 C119 104 108 58 75 30Z" fill="#dbc5ee"/>
        <path d="M30 155 C72 94 121 96 160 155 C130 180 68 184 30 155Z" fill="#efd5dc"/>
        <path d="M71 20 C54 18 48 39 58 53 C72 68 94 52 90 34 C88 24 80 21 71 20Z" fill="#1f2025" opacity=".75"/>
        <path d="M56 39 C44 95 45 132 38 172" stroke="#15151b" stroke-width="18" stroke-linecap="round" opacity=".8"/>
        <path d="M91 38 C114 91 113 133 120 174" stroke="#15151b" stroke-width="18" stroke-linecap="round" opacity=".8"/>
      </g>
      <g transform="translate(1140 700)" opacity=".82">
        <ellipse cx="55" cy="45" rx="56" ry="34" fill="#c87955"/>
        <circle cx="28" cy="24" r="24" fill="#d58a62"/>
        <path d="M13 6 l-2 -24 l17 17zM39 3 l14 -20 l3 25z" fill="#9a5747"/>
        <circle cx="20" cy="23" r="3" fill="#503836"/><circle cx="35" cy="22" r="3" fill="#503836"/>
        <path d="M95 49 C135 48 142 15 109 13 C121 29 111 40 95 49Z" fill="#b35f4e"/>
        <path d="M103 30 C118 35 127 29 132 21" stroke="#f1c29a" stroke-width="6" fill="none" opacity=".8"/>
      </g>
      <g opacity=".32" fill="#fff2f7">
        <circle cx="120" cy="120" r="8"/><circle cx="340" cy="95" r="5"/><circle cx="780" cy="130" r="7"/><circle cx="1340" cy="230" r="8"/><circle cx="1420" cy="360" r="5"/><circle cx="1010" cy="90" r="4"/>
      </g>
      <g opacity=".3" fill="#f6c3d3">
        <ellipse cx="190" cy="220" rx="13" ry="6" transform="rotate(-22 190 220)"/><ellipse cx="480" cy="155" rx="10" ry="5" transform="rotate(18 480 155)"/><ellipse cx="700" cy="245" rx="12" ry="5" transform="rotate(-15 700 245)"/><ellipse cx="1260" cy="135" rx="13" ry="6" transform="rotate(28 1260 135)"/><ellipse cx="1510" cy="300" rx="10" ry="5" transform="rotate(-8 1510 300)"/>
      </g>
    </svg>
  </div>

  <aside class="sidebar glass">
    <div class="brand">
      <span class="logo">✦</span>
      <div><strong>Dressing & Beauty</strong><small>personal dashboard</small></div>
    </div>
    <nav id="nav"></nav>
    <button id="resetDemo" class="ghost-btn">Réinitialiser les exemples</button>
  </aside>

  <main class="app-shell">
    <header class="hero glass">
      <div>
        <p class="eyebrow">carnet mode · beauté · colorimétrie</p>
        <h1>Dressing & Beauty Dashboard</h1>
        <p class="subtitle">Un tableau de bord doux et visuel pour organiser tes vêtements, tes soins, ton maquillage et tes inspirations.</p>
      </div>
      <div class="weather-card">
        <span>🌸</span><strong>Ambiance du jour</strong><small>matin doré · pastel · zen</small>
      </div>
    </header>

    <section id="dashboard" class="view active"></section>
    <section id="dressing" class="view"></section>
    <section id="colorimetrie" class="view"></section>
    <section id="outfits" class="view"></section>
    <section id="makeup" class="view"></section>
    <section id="skincare" class="view"></section>
    <section id="wishlist" class="view"></section>
    <section id="inspirations" class="view"></section>
    <section id="stats" class="view"></section>
  </main>

  <dialog id="itemDialog" class="glass modal">
    <form method="dialog" id="itemForm">
      <h2 id="dialogTitle">Ajouter</h2>
      <div id="formFields" class="form-grid"></div>
      <menu>
        <button value="cancel" class="ghost-btn">Annuler</button>
        <button id="saveItem" value="default" class="primary-btn">Enregistrer</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
