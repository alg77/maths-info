    const withCoords = onlyCoords.checked;
    const favOnly = onlyFav.checked;
    const hideS = hideSold.checked;
    const smin = parseFloat(surfMin.value||'');
    const smax = parseFloat(surfMax.value||'');
    const dpeAllowed = new Set(dpeChecks.filter(c=>c.checked).map(c=>c.value));

    let rows = CARDS.filter(c=> (
      (!selectedVilles.length || selectedVilles.includes(c.ville)) &&
      (!pm || (c.prix||0) <= pm) &&
      (!withCoords || c.has_coords) &&
      (!favOnly || favs.has(c.safe)) &&
      (!hideS || (!(c.vendu || c.supprime))) &&
      (!surfMin.value || (c.surface||0) >= smin) &&
      (!surfMax.value || (c.surface||0) <= smax) &&
      (dpeAllowed.has('ND') ? (true) : (c.dpe)) &&
      (c.dpe ? dpeAllowed.has(c.dpe) : dpeAllowed.has('ND')) &&
      (!query || (c.nom+c.ville+c.secteur+c.etat).toLowerCase().includes(query))
    ));

    const sort = sortSel.value;
    rows.sort((a,b)=>{
      if (sort==='prix-asc') return (a.prix||0) - (b.prix||0);
      if (sort==='prix-desc') return (b.prix||0) - (a.prix||0);
      if (sort==='surf-asc') return (a.surface||0) - (b.surface||0);
      if (sort==='surf-desc') return (b.surface||0) - (a.surface||0);
      return a.nom.localeCompare(b.nom);
    });
    return rows;
  }

  function render(){
    grid.innerHTML='';
    const rows = applyFiltersAndSort();
    window._rows = rows; // pour export
    countSpan.textContent = rows.length.toString();

    const filters = [];
    const selectedVilles = [...villes.options].filter(o=>o.selected).map(o=>o.value);
    if (selectedVilles.length && selectedVilles.length !== villes.options.length) filters.push('Villes: '+selectedVilles.join(', '));
    const pm = parseInt(priceMax.value||'0'); if (pm>0) filters.push('≤ '+pm.toLocaleString('fr-FR')+' €');
    const query = q.value.trim().toLowerCase(); if (query) filters.push('Recherche: '+query);
    if (onlyCoords.checked) filters.push('Avec localisation');
    if (onlyFav.checked) filters.push('Favoris');
    if (hideSold.checked) filters.push('Masquer vendues/supprimées');
    if (surfMin.value) filters.push('Surface ≥ '+surfMin.value+' m²');
    if (surfMax.value) filters.push('Surface ≤ '+surfMax.value+' m²');
    const dpeSel = dpeChecks.filter(c=>c.checked).map(c=>c.value);
    if (dpeSel.length && dpeSel.length<8) filters.push('DPE: '+dpeSel.join(','));
    const AF = document.getElementById('activeFilters'); AF.innerHTML=''; filters.forEach(t=>AF.appendChild(pill(t)));

    rows.forEach(c=>{
      const el = document.createElement('div'); el.className='card';
      const favOn = favs.has(c.safe) ? '★' : '☆';
      const distBits = Object.entries(c.distances||{}).map(([k,v])=>`<div class="distance">${k}: ~${v.km} km, ~${Math.round(v.min)} min</div>`).join('');
      const status = c.vendu ? '<div class="sold-ribbon">Vendu</div>' : (c.supprime ? '<div class="sold-ribbon sold-gray">Supprimée</div>' : (c.sc_date ? `<div class="sold-ribbon sold-amber">Sous compromis — ${c.sc_date}</div>` : ''));
      el.innerHTML = `
        ${c.thumb || ''}
        ${status}
        <div class="meta">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="title"><a href="${c.detail}" target="_blank">${c.nom}</a></div>
            <div class="fav" title="Favori">${favOn}</div>
          </div>
          <div class="muted">${c.ville} (${c.cp})</div>
          <div class="price">${c.prix_raw || fmtPrice(c.prix)}</div>
          <div class="badges">
            ${c.dpe?`<span class="badge">DPE ${c.dpe}</span>`:''}
            ${c.ges?`<span class="badge">GES ${c.ges}</span>`:''}
            ${c.surface?`<span class="badge">${c.surface} m²</span>`:''}
            ${c.terrain?`<span class ="badge">${c.terrain} m² terrain</span>`:''}
            ${c.pieces?`<span class="badge">${c.pieces} p.</span>`:''}
          </div>
          ${distBits}
          <div class="actions">
            <a href="${c.detail}" target="_blank">Détails</a>
            <a href="#" data-comp="${c.safe}">Comparer</a>
          </div>
        </div>`;
      el.querySelector('.fav').addEventListener('click', ()=>{ if (favs.has(c.safe)) favs.delete(c.safe); else favs.add(c.safe); saveFavs(); render(); });
      el.querySelector('[data-comp]').addEventListener('click', (e)=>{ e.preventDefault(); const id = e.currentTarget.getAttribute('data-comp'); if (comp.has(id)) comp.delete(id); else comp.add(id); saveComp(); updateCompare(); });
      // --- Ruban prioritaire : 'Visité le …' au-dessus, sinon 'Contacté le …' ---
      (function(){
        function mk(text, bg){
          const r = document.createElement('div');
          r.className = 'sold-ribbon'; r.textContent = text;
          r.style.position='absolute'; r.style.left='8px'; r.style.top='8px'; r.style.background=bg;
          return r;
        }
        let my = null;
        if (c.visited && String(c.visited).trim())      my = mk('Visité le ' + c.visited,  '#10b981');
        else if (c.contacted && String(c.contacted).trim()) my = mk('Contacté le ' + c.contacted, '#0ea5e9');
        if (my){
          el.appendChild(my);
          const step=30, top=8; const all = Array.from(el.querySelectorAll('.sold-ribbon'));
          el.insertBefore(my, all[0] || null);
          Array.from(el.querySelectorAll('.sold-ribbon')).forEach((rr,i)=> rr.style.top = (top + step*i) + 'px');
        }
      })();
      grid.appendChild(el);
    });
  }

  function updateCompare(){ compareList.innerHTML = [...comp].join(' | '); compareBar.style.display = comp.size>0 ? 'flex' : 'none'; if (comp.size>0){ const urls = CARDS.filter(c=>comp.has(c.safe)).map(c=>c.detail); openCompare.href = urls.length ? urls[0] : '#'; openCompare.onclick = (e)=>{ if (urls.length) urls.forEach(u=>window.open(u,'_blank')); } } }

  function csvEscape(v){ if (v==null) return ''; const s = String(v).replace(/"/g,'""'); return '"'+s+'"'; }
  function exportCSV(){
    const rows = (window._rows||[]);
    const headers = ['Nom','Ville','CP','Prix','Surface','Pièces','Chambres','DPE','GES','Détails','URLs'];
    const out = [headers.map(csvEscape).join(',')].concat(rows.map(r=>[
      csvEscape(r.nom), csvEscape(r.ville), csvEscape(r.cp), csvEscape(r.prix_raw || r.prix), csvEscape(r.surface), csvEscape(r.pieces), csvEscape(r.chambres), csvEscape(r.dpe), csvEscape(r.ges), csvEscape(location.origin+location.pathname.replace(/[^\/]*$/, '')+r.detail), csvEscape((r.urls||[]).join(' | '))
    ].join(',')));
    const blob = new Blob([out.join('\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='annonces_filtrees.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 500);
  }
  exportBtn.addEventListener('click', exportCSV);

  ;['change','input'].forEach(ev=>{
    villes.addEventListener('change', render);
    priceMax.addEventListener('input', render);
    sortSel.addEventListener('change', render);
    q.addEventListener('input', render);
    onlyCoords.addEventListener('change', render);
    onlyFav.addEventListener('change', render);
    hideSold.addEventListener('change', render);
    surfMin.addEventListener('input', render);
    surfMax.addEventListener('input', render);
    dpeChecks.forEach(c=>c.addEventListener('change', render));
  });

  render(); updateCompare();
</script>

</body>
</html>
