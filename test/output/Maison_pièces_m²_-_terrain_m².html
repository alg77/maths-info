<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Maison  pièces  m² - terrain  m²</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --card:#fff; --ink:#1f2937; --muted:#6b7280; --accent:#0ea5e9; --bg:#f3f4f6; }
    @media (prefers-color-scheme: dark) { :root { --card:#111827; --ink:#e5e7eb; --muted:#9ca3af; --accent:#38bdf8; --bg:#0b1220; } }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:16px; color:var(--ink); background:var(--bg); }
    a { color: var(--accent); text-decoration: none; }
    .wrap { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
    .main { flex:2 1 420px; }
    .side { flex:1 1 280px; background:var(--card); border-radius:12px; padding:16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .hero { position:relative; }
    .hero img { width:100%; height:auto; border-radius:12px; }
    h1 { margin:8px 0 2px; }
    .sub { color:var(--muted); margin-bottom:8px; }
    .price { font-size:1.8rem; font-weight:700; margin:8px 0 4px; }
    .ppm2 { color:var(--muted); margin-bottom:8px; }
    .kv { display:grid; grid-template-columns: 1fr 1fr; gap:8px 16px; margin:10px 0; }
    .kv div strong { display:block; font-size:.85rem; color:var(--muted); }
    .map-preview { width:100%; height:220px; border:0; border-radius:10px; margin:10px 0; }
    .links a { display:block; margin:6px 0; }
    .gallery { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
    .gallery div { width:150px; }
    .gallery img { width:100%; height:auto; border-radius:10px; cursor:pointer; }
    .desc p { background:var(--card); padding:12px; border-radius:10px; }
    .badges { display:flex; gap:8px; align-items:center; margin:6px 0; }
    .badge { padding:4px 8px; border-radius:999px; font-weight:600; font-size:.8rem; }
    .dpe-A { background:#16a34a22; border:1px solid #16a34a55; }
    .dpe-B { background:#22c55e22; border:1px solid #22c55e55; }
    .dpe-C { background:#84cc1622; border:1px solid #84cc1655; }
    .dpe-D { background:#eab30822; border:1px solid #eab30855; }
    .dpe-E { background:#f9731622; border:1px solid #f9731655; }
    .dpe-F { background:#ef444422; border:1px solid #ef444455; }
    .dpe-G { background:#991b1b22; border:1px solid #991b1b55; }
    .ges-A, .ges-B, .ges-C, .ges-D, .ges-E, .ges-F, .ges-G { background:#33415522; border:1px solid #33415555; }
    .tray { background:var(--card); padding:12px; border-radius:10px; margin:10px 0; }
    .tray li { margin:6px 0; }
    /* RIBBONS */
    .ribbon { position:absolute; top:12px; left:12px; font-weight:700; padding:6px 12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.25); text-transform:uppercase; letter-spacing:.5px; color:#fff; }
    .ribbon-red { background:#ef4444; }
    .ribbon-amber { background:#f59e0b; }
    .ribbon-gray { background:#6b7280; }
    /* Lightbox */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; }
    .overlay img { max-width:90vw; max-height:90vh; border-radius:10px; }
    .overlay .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:2rem; color:#fff; cursor:pointer; user-select:none; padding:0 16px; }
    .overlay .prev { left:0; } .overlay .next { right:0; }
    .overlay .close { position:absolute; top:8px; right:16px; font-size:2rem; color:#fff; cursor:pointer; }

    /* Flags (visité / contact) */
    .flag { position:absolute; top:12px; right:12px; padding:4px 10px; border-radius:999px; font-weight:700; color:#0b1220; background:#e5e7eb; margin-left:8px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .flag + .flag { top:46px; }
    .flag-green { background:#bbf7d0; }
    .flag-blue  { background:#bae6fd; }

  .fiche-bar{padding:12px 16px}
.btn-fiche{display:inline-block;padding:.6rem .9rem;border:none;border-radius:.5rem;background:#0ea5e9;color:#fff;text-decoration:none;font-weight:600}
.btn-fiche:hover{filter:brightness(.95)}
</style>
</head>
<body>
  <div class="fiche-bar"><a href="Maison_pièces_m²_-_terrain_m²_fiche.html" target="_blank" class="btn-fiche">📝 Fiche</a></div>
  <h1>Maison  pièces  m² - terrain  m²</h1>
  <div class="sub">Annet-sur-Marne (77410.0)</div>
  <div class="wrap">
    <div class="main">
      <div class="hero"></div>
      
      <div class="desc"></div>
    </div>
    <aside class="side">
      <div class="price">Prix : 395 000 €</div>
      
      <div class="badges">
        <span style="display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;background:#e5e7eb;color:#0b1220;">DPE N</span> <span style="display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;background:#e5e7eb;color:#0b1220;">GES N</span>
        <span class="badge">nan m²</span>
        <span class="badge">nan p.</span>
        
      </div>
      <div class="kv">
        
        
        
        
      </div>
      
      <div class="tray">
        <strong>Liens</strong>
        <div class="links">
          
          
          
        </div>
      </div>
      
      
      <div class="tray">
        <strong>Caractéristiques techniques</strong>
        <table class="kv">
          <tr><td>Date de construction</td><td style="width:70%"></td></tr>
          <tr><td>Type de chauffage</td><td></td></tr>
          <tr><td>Type de chaudière (+ âge)</td><td></td></tr>
        </table>
      </div>

    </aside>
  </div>

  <!-- Lightbox -->
  <div id="overlay" class="overlay">
    <span class="close" onclick="closeLb()">×</span>
    <span class="nav prev" onclick="prevLb()">❮</span>
    <img id="lbimg" src=""/>
    <span class="nav next" onclick="nextLb()">❯</span>
  </div>
  <script>
    let imgs = [], cur = 0;
    document.querySelectorAll('.gallery img').forEach((el,i)=>{ imgs.push(el.src); el.addEventListener('click',()=>openLb(i)); });
    const ov = document.getElementById('overlay'); const lb = document.getElementById('lbimg');
    function openLb(i){ cur=i; lb.src=imgs[cur]; ov.style.display='flex'; }
    function closeLb(){ ov.style.display='none'; }
    function prevLb(){ cur=(cur-1+imgs.length)%imgs.length; lb.src=imgs[cur]; }
    function nextLb(){ cur=(cur+1)%imgs.length; lb.src=imgs[cur]; }
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') prevLb(); if(e.key==='ArrowRight') nextLb(); });
  </script>
</body>
</html>
