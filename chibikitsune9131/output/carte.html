<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de mes maisons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#FBF7F9; --card:#FFFFFF; --ink:#3E3644; --soft:#8A7E90; --line:#EFE4EA; --line2:#E4D6DE;
  --rose:#F6DCE4; --rose-ink:#A24D6D; --sage:#DCEDE2; --sage-ink:#3D6B53; --lilas:#E7E1F5; --lilas-ink:#5A4D8C;
  --peche:#FCE6D8; --peche-ink:#93543A; --beurre:#F8EFCB; --beurre-ink:#76601F; --ciel:#DFECF6; --ciel-ink:#3A6587;
  --gris:#EEEAF0; --gris-ink:#6A6270;
  --shadow:0 1px 2px rgba(62,54,68,.05), 0 10px 28px -16px rgba(62,54,68,.18);
  --serif:'Young Serif', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#211C25; --card:#2B2530; --ink:#F1E8EE; --soft:#A99CAE; --line:#3A3240; --line2:#463D4D;
  --rose:#4A2F3C; --rose-ink:#F2B6CA; --sage:#2D4236; --sage-ink:#A9D8BC; --lilas:#383057; --lilas-ink:#CCC2F2;
  --peche:#4A3328; --peche-ink:#F5C3A6; --beurre:#463C1F; --beurre-ink:#EBD58A; --ciel:#283B4C; --ciel-ink:#AFD0EC;
  --gris:#38323D; --gris-ink:#C9C0CE; --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);font-feature-settings:"tnum" 0}
a{color:var(--rose-ink);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--rose-ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;margin:0;line-height:1.2}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.soft{color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line2);
     background:var(--card);color:var(--ink);font:500 14px var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{text-decoration:none;border-color:var(--rose-ink)}
.btn.main{background:var(--rose-ink);border-color:var(--rose-ink);color:#fff}
@media (prefers-color-scheme: dark){ .btn.main{color:#2B2530} }
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font:500 12.5px/1.5 var(--sans);
      background:var(--gris);color:var(--gris-ink);white-space:nowrap}
.chip.rose{background:var(--rose);color:var(--rose-ink)} .chip.sage{background:var(--sage);color:var(--sage-ink)}
.chip.lilas{background:var(--lilas);color:var(--lilas-ink)} .chip.peche{background:var(--peche);color:var(--peche-ink)}
.chip.beurre{background:var(--beurre);color:var(--beurre-ink)} .chip.ciel{background:var(--ciel);color:var(--ciel-ink)}
.chip.ligne{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.chip.strong{font-weight:600}
.dpe{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font:600 12.5px/1.5 var(--sans)}
.dpe.A{background:#C7E6CF;color:#245A38}.dpe.B{background:#D9ECC3;color:#3F5F22}.dpe.C{background:#ECF0C2;color:#56601B}
.dpe.D{background:#F8ECBC;color:#6E5A16}.dpe.E{background:#F9DCBE;color:#7E4A20}.dpe.F{background:#F6C9BA;color:#863A27}
.dpe.G{background:#EFBAC5;color:#842B42}.dpe.X{background:var(--gris);color:var(--gris-ink)}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px}
.note{color:var(--soft);font-size:12.5px;line-height:1.5}
.up{color:var(--rose-ink)} .down{color:var(--sage-ink)}
input,select,button{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.entete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}
.entete h1{font-size:clamp(2rem,4vw,2.8rem)}
.entete p{margin:6px 0 0;color:var(--soft)}
.barre{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px;font-size:14px}
.puce{border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.puce.on{background:var(--card);border-color:var(--rose-ink);font-weight:600}
.puce i{width:10px;height:10px;border-radius:50%;display:inline-block}
.barre input[type=number]{width:120px;padding:6px 9px;border-radius:10px;border:1px solid var(--line2);background:var(--paper)}
.zone{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
#map{height:calc(100vh - 170px);min-height:520px;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cote{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;max-height:calc(100vh - 170px);overflow:auto}
.cote h2{font-size:1.05rem;margin:0 0 8px}
.cote li{margin:0;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)} .cote ul{list-style:none;padding:0;margin:0}
.cote .prixs{font:400 1rem var(--serif);color:var(--rose-ink);margin-right:4px}
.cote li > a:first-child{color:var(--ink)} .cote .ret{font-size:13px}
.filtres-sans{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;font-size:13.5px}
.filtres-sans select{padding:6px 8px;border-radius:10px;border:1px solid var(--line2);background:var(--paper)}
.filtres-sans label{display:flex;gap:6px;align-items:center}
.pop{font:14px/1.45 var(--sans);min-width:220px}
.pop img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:6px}
.pop b{font:400 1.15rem var(--serif);color:#A24D6D}
.pop .chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.pop .chip{font-size:11.5px;padding:1px 8px}
.leaflet-container a{color:var(--rose-ink)} .leaflet-popup-content-wrapper{border-radius:14px}
@media (max-width:900px){.zone{grid-template-columns:1fr} #map{height:65vh}.cote{max-height:none}}
</style>
</head>

    <nav style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="annonces.html">Mes annonces</a><a class="btn" href="a_pied.html">À pied de St Laurent</a><a class="btn" href="ventes.html">Ventes du secteur</a></nav>

</div>

<script>
// Fonds de carte qui acceptent les pages ouvertes depuis un fichier (OpenStreetMap.org les refuse)
function fondsCarte(map, defaut){
  const ign = (couche, fmt) => 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+couche+
    '&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT='+fmt;
  const f = {
    'Plan IGN': L.tileLayer(ign('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'), {maxZoom:20, maxNativeZoom:19, attribution:'© IGN – Géoplateforme'}),
    'Photo aérienne IGN': L.tileLayer(ign('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'), {maxZoom:20, maxNativeZoom:19, attribution:'© IGN – Géoplateforme'}),
    'Plan clair': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {subdomains:'abcd', maxZoom:20, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, © <a href="https://carto.com/attributions">CARTO</a>'}),
  };
  // secours : si un fond ne répond pas, on passe au suivant
  const ordre = Object.keys(f);
  ordre.forEach((nom,i)=>{ let err=0, ok=0; const c=f[nom];
    c.on('tileload',()=>ok++);
    c.on('tileerror',()=>{ err++; if(err===6 && ok===0 && map.hasLayer(c)){ const suiv=f[ordre[(i+1)%ordre.length]];
      map.removeLayer(c); suiv.addTo(map); } }); });
  f[defaut].addTo(map);
  return f;
}

// Zones à pied autour de St Laurent : temps réels par les rues (grille calculée par le script)
const ZONES_COUL = [[10, '#3D6B53'], [15, '#6FA586'], [20, '#C0607F']];
function zonesPied(map, Z, renderer) {
  const g = L.layerGroup();
  if (!Z || !Z.cells || !Z.cells.length) return g;
  const C = {}, B = (i, j) => [[Z.lat0 + (i - .5) * Z.dlat, Z.lon0 + (j - .5) * Z.dlon], [Z.lat0 + (i + .5) * Z.dlat, Z.lon0 + (j + .5) * Z.dlon]];
  Z.cells.forEach(([i, j, m]) => C[i + ',' + j] = m);
  const r = renderer || L.canvas({padding: .3});
  Z.cells.forEach(([i, j, m]) => { const c = m <= 10 ? '#A9D3B8' : m <= 15 ? '#D6ECDD' : m <= 20 ? '#F6DCE4' : null;
    if (c) L.rectangle(B(i, j), {renderer: r, stroke: false, fillColor: c, fillOpacity: .45, interactive: false}).addTo(g); });
  ZONES_COUL.forEach(([t, col]) => {
    const ok = (i, j) => (C[i + ',' + j] ?? 99) <= t, seg = [];
    for (const k in C) { const [i, j] = k.split(',').map(Number); if (!ok(i, j)) continue; const [[a, b], [c, d]] = B(i, j);
      if (!ok(i + 1, j)) seg.push([[c, b], [c, d]]); if (!ok(i - 1, j)) seg.push([[a, b], [a, d]]);
      if (!ok(i, j + 1)) seg.push([[a, d], [c, d]]); if (!ok(i, j - 1)) seg.push([[a, b], [c, b]]); }
    L.polyline(seg, {renderer: r, color: col, weight: 2.2, opacity: .9, interactive: false}).addTo(g);
  });
  const leg = L.control({position: 'bottomleft'});
  leg.onAdd = () => { const d = L.DomUtil.create('div'); d.style.cssText = 'background:rgba(255,255,255,.92);color:#3E3644;padding:6px 9px;border-radius:10px;font:500 12px system-ui;line-height:1.6';
    d.innerHTML = ZONES_COUL.map(([t, c]) => `<div><span style="display:inline-block;width:14px;height:3px;background:${c};vertical-align:middle;margin-right:6px"></span>${t} min à pied</div>`).join(''); return d; };
  g.on('add', () => leg.addTo(map)); g.on('remove', () => leg.remove());
  return g;
}

const $ = id => document.getElementById(id);
const eur = n => n==null ? '—' : Math.round(n).toLocaleString('fr-FR')+' €';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUTS = {vente:['En vente','#C0607F'], compromis:['Sous compromis','#D9A441'], vendue:['Vendue','#8E86A8'], supprimee:['Supprimée','#B8B0BE']};
let favs=new Set(); try{ favs=new Set(JSON.parse(localStorage.getItem('house_favs')||'[]')); }catch(e){}
const actifs = new Set(['vente','compromis']);
const map = L.map('map');
L.control.layers(fondsCarte(map, 'Plan IGN')).addTo(map);
POIS.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:10,weight:3,color:'#5A4D8C',fillColor:'#E7E1F5',fillOpacity:1})
  .bindTooltip(p.nom,{permanent:true,direction:'top',offset:[0,-8]}).addTo(map));
const zones = zonesPied(map, ZONES); if (ZONES) zones.addTo(map);
const cz = document.getElementById('zonesOn');
if (cz) { cz.hidden = !ZONES; cz.querySelector('input').addEventListener('change', e => e.target.checked ? zones.addTo(map) : map.removeLayer(zones)); }
let calque=L.layerGroup().addTo(map), premier=true;
$('puces').innerHTML=Object.entries(STATUTS).map(([k,[lib,col]])=>`<button class="puce${actifs.has(k)?' on':''}" data-k="${k}"><i style="background:${col}"></i>${lib}</button>`).join('')
  +`<button class="puce" data-k="fav"><i style="background:#F2B6CA"></i>Favoris seulement</button>`;
let favSeul=false;
document.querySelectorAll('#puces .puce').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k;
  if(k==='fav'){ favSeul=!favSeul; b.classList.toggle('on',favSeul); } else { actifs.has(k)?actifs.delete(k):actifs.add(k); b.classList.toggle('on',actifs.has(k)); }
  dessiner(); }));
$('prixMax').addEventListener('input',dessiner);
function dessiner(){
  calque.clearLayers(); const pm=parseInt($('prixMax').value||'0'); const pts=[];
  M.forEach(m=>{
    if(!actifs.has(m.statut)) return; if(pm && m.prix>pm) return; if(favSeul && !favs.has(m.safe)) return;
    const col=STATUTS[m.statut][1];
    const mk=L.circleMarker([m.lat,m.lon],{radius:favs.has(m.safe)?10:8,weight:favs.has(m.safe)?3:2,color:'#fff',fillColor:col,fillOpacity:.95});
    mk.bindPopup(`<div class="pop">${m.thumb?`<img src="${esc(m.thumb)}" alt="">`:''}<div>${esc(m.nom)}</div>${m.vente ? `<b>Vendue ${eur(m.vente.fai||m.vente.acte)}</b>
      <div class="soft" style="font-size:12.5px">affichée ${eur(m.prix)}${m.vente.ecart!=null?` (<span class="${m.vente.ecart<0?'down':'up'}">${m.vente.ecart>0?'+':'−'}${Math.abs(m.vente.ecart).toFixed(1).replace('.',',')} %</span>)`:''},
        ${m.vente.mode==='acquereur'||m.vente.mode==='acquereur_defaut'?'frais d’agence inclus (acte : '+eur(m.vente.acte)+')':m.vente.mode==='vendeur'?'honoraires inclus':'prix de l’acte'}</div>` : `<b>${eur(m.prix)}</b>`}
      ${m.cout?`<div class="soft" style="font-size:12.5px">≈ ${eur(m.cout)}/mois tout compris</div>`:''}
      <div class="chips">${(m.statuts||[]).concat(m.risques||[]).map(s=>`<span class="chip ${s[1]}">${esc(s[0])}</span>`).join('')}</div>
      <div class="soft">${esc(m.ville)}${m.adresse?' · '+(m.lien_adr?`<a href="${esc(m.lien_adr)}" target="_blank" rel="noopener">${esc(m.adresse)}</a>`:esc(m.adresse)):''}</div>
      <div style="margin-top:6px;display:flex;gap:12px"><a href="${esc(m.detail)}" target="_blank" rel="noopener">Voir la fiche</a><a href="${esc(m.fiche)}" target="_blank">Fiche de visite</a></div></div>`);
    mk.bindTooltip(m.vente?eur(m.prix)+' → '+eur(m.vente.fai||m.vente.acte):eur(m.prix),{direction:'top',offset:[0,-6]});
    mk.addTo(calque); pts.push([m.lat,m.lon]);
  });
  $('nb').textContent=pts.length+' maison'+(pts.length>1?'s':'')+' sur la carte';
  if(premier && pts.length){ map.fitBounds(pts.concat(POIS.map(p=>[p.lat,p.lon])),{padding:[30,30],maxZoom:15}); premier=false; }
  else if(premier) map.setView([POIS[0].lat,POIS[0].lon],13);
}
// liste des maisons sans position : filtre par ville, tri, prix
const VILLES_SANS=[...new Set(SANS.map(s=>s.ville))].sort((a,b)=>a.localeCompare(b,'fr'));
$('sansVille').innerHTML='<option value="">Toutes les villes ('+SANS.length+')</option>'+VILLES_SANS.map(v=>`<option>${esc(v)}</option>`).join('');
function listeSans(){
  const v=$('sansVille').value, t=$('sansTri').value, venteSeule=$('sansVente').checked;
  let l=SANS.filter(s=>(!v||s.ville===v)&&(!venteSeule||s.statut==='vente'||s.statut==='compromis'));
  const by={'prix-asc':(a,b)=>(a.prix||1e9)-(b.prix||1e9),'prix-desc':(a,b)=>(b.prix||0)-(a.prix||0),
            'ville':(a,b)=>a.ville.localeCompare(b.ville,'fr')||(a.prix||0)-(b.prix||0),'pistes':(a,b)=>(b.nb||0)-(a.nb||0)};
  l.sort(by[t]);
  const lib={vente:'',compromis:' · sous compromis',vendue:' · vendue',supprimee:' · supprimée'};
  $('sans').innerHTML = l.length ? l.map(s=>`<li><a href="${esc(s.detail)}" target="_blank" rel="noopener"><b class="prixs">${eur(s.prix)}</b> ${esc(s.nom)}</a>
    <span class="soft">· ${esc(s.ville)}${lib[s.statut]||''}</span>${s.retrouver?`<br><a class="ret" href="${esc(s.retrouver)}" target="_blank" rel="noopener">Retrouver la maison (${s.nb} pistes)</a>`:''}</li>`).join('')
    : '<li class="soft">Aucune maison pour ce filtre.</li>';
}
['sansVille','sansTri','sansVente'].forEach(id=>$(id).addEventListener('change',listeSans));
listeSans();
dessiner();
