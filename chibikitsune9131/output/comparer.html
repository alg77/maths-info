<style>
:root{
  --paper:#FBF7F9; --card:#FFFFFF; --ink:#3E3644; --soft:#8A7E90; --line:#EFE4EA; --line2:#E4D6DE;

  --serif:'Young Serif', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#211C25; --card:#2B2530; --ink:#F1E8EE; --soft:#A99CAE; --line:#3A3240; --line2:#463D4D;

}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);font-feature-settings:"tnum" 0}
a{color:var(--rose-ink);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--rose-ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;margin:0;line-height:1.2}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.soft{color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line2);
     background:var(--card);color:var(--ink);font:500 14px var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{text-decoration:none;border-color:var(--rose-ink)}
.btn.main{background:var(--rose-ink);border-color:var(--rose-ink);color:#fff}
@media (prefers-color-scheme: dark){ .btn.main{color:#2B2530} }
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font:500 12.5px/1.5 var(--sans);
      background:var(--gris);color:var(--gris-ink);white-space:nowrap}
.chip.rose{background:var(--rose);color:var(--rose-ink)} .chip.sage{background:var(--sage);color:var(--sage-ink)}
.chip.lilas{background:var(--lilas);color:var(--lilas-ink)} .chip.peche{background:var(--peche);color:var(--peche-ink)}
.chip.beurre{background:var(--beurre);color:var(--beurre-ink)} .chip.ciel{background:var(--ciel);color:var(--ciel-ink)}
.chip.ligne{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.chip.strong{font-weight:600}
.dpe{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font:600 12.5px/1.5 var(--sans)}
.dpe.A{background:#C7E6CF;color:#245A38}.dpe.B{background:#D9ECC3;color:#3F5F22}.dpe.C{background:#ECF0C2;color:#56601B}
.dpe.D{background:#F8ECBC;color:#6E5A16}.dpe.E{background:#F9DCBE;color:#7E4A20}.dpe.F{background:#F6C9BA;color:#863A27}
.dpe.G{background:#EFBAC5;color:#842B42}.dpe.X{background:var(--gris);color:var(--gris-ink)}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px}
.note{color:var(--soft);font-size:12.5px;line-height:1.5}
.up{color:var(--rose-ink)} .down{color:var(--sage-ink)}
input,select,button{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.entete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:16px}
.entete h1{font-size:clamp(2rem,4vw,2.8rem)} .entete p{margin:6px 0 0;color:var(--soft)}
.ajout{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ajout select{padding:8px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);max-width:100%}
.tablewrap{overflow-x:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:14px;font-variant-numeric:tabular-nums;table-layout:fixed}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere}
.cmp tbody th{color:var(--soft);font-weight:500;font-size:13px;width:170px;position:sticky;left:0;background:var(--card)}
.cmp thead th{width:170px}
.cmp thead td{vertical-align:bottom}
.cmp .photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px;background:var(--rose)}
.cmp .titre{font:400 1rem/1.3 var(--serif)} .cmp .titre a{color:var(--ink)}
.cmp .retirer{border:0;background:none;color:var(--soft);cursor:pointer;font-size:13px;padding:0;margin-top:4px;text-decoration:underline}
.cmp .groupe th{background:var(--paper);color:var(--rose-ink);font:400 1rem var(--serif);padding-top:14px}
.cmp td.top{background:color-mix(in srgb, var(--sage) 75%, transparent)}
.cmp td.top::after{content:" ✓";color:var(--sage-ink);font-weight:700}
.cmp .prix{font:400 1.3rem var(--serif);color:var(--rose-ink)}
.vide{padding:40px;text-align:center;color:var(--soft);background:var(--card);border-radius:20px}
</style>

function rendre(){

  $('choix').disabled = ids.length>=4;

  for(const [groupe,...lignes] of LIGNES){
    h+=`<tr class="groupe"><th colspan="${cs.length+1}">${groupe}</th></tr>`;
    for(const [lib,aff,val,sens] of lignes){
      let best=null;
      if(sens && val && cs.length>1){ const vs=cs.map(val).filter(v=>v!=null&&!isNaN(v));

    }
  }
  $('zone').innerHTML='<div class="tablewrap">'+h+'</tbody></table></div>';
  document.querySelectorAll('.retirer').forEach(b=>b.onclick=()=>{ ids=ids.filter(i=>i!==b.dataset.id); rendre(); });
}
