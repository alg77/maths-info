<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SakuraMaths">
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset=".48" stop-color="#ffe6ee"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="fur" x1="36" y1="22" x2="92" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a3f"/>
      <stop offset=".62" stop-color="#e76928"/>
      <stop offset="1" stop-color="#9d3f21"/>
    </linearGradient>
    <linearGradient id="cream" x1="36" y1="48" x2="92" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#ffe2bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c3a58" flood-opacity=".22"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#d98ba4" stroke-width="3" opacity=".65"/>

  <!-- petite grille / clin d'œil maths, très légère pour rester lisible en onglet -->
  <g stroke="#8fb3d9" stroke-width="2" stroke-linecap="round" opacity=".42">
    <path d="M22 91h38M28 102h42M35 80l24 30"/>
    <path d="M22 103c13-21 27-31 48-33" fill="none"/>
  </g>

  <g filter="url(#shadow)">
    <!-- oreilles -->
    <path d="M31 43C25 19 42 14 53 33L45 55Z" fill="#6b2f22"/>
    <path d="M97 43C103 19 86 14 75 33L83 55Z" fill="#6b2f22"/>
    <path d="M35 41C32 28 42 25 49 35L43 49Z" fill="#ffe7c8"/>
    <path d="M93 41C96 28 86 25 79 35L85 49Z" fill="#ffe7c8"/>

    <!-- tête panda roux -->
    <path d="M26 59C24 38 42 26 64 26S104 38 102 59c7 22-9 44-38 46C35 103 19 81 26 59Z" fill="#6b2f22"/>
    <path d="M31 59C29 42 44 31 64 31s35 11 33 28c6 18-7 37-33 39-26-2-39-21-33-39Z" fill="url(#fur)"/>

    <!-- masque clair -->
    <path d="M33 68c8-14 20-14 29-4-6 19-18 27-31 20-4-6-3-12 2-16Z" fill="url(#cream)"/>
    <path d="M95 68c-8-14-20-14-29-4 6 19 18 27 31 20 4-6 3-12-2-16Z" fill="url(#cream)"/>
    <path d="M52 73c5-8 19-8 24 0 2 15-5 24-12 24s-14-9-12-24Z" fill="url(#cream)"/>
    <ellipse cx="49" cy="50" rx="10" ry="5.5" fill="#fff1d2" transform="rotate(-12 49 50)"/>
    <ellipse cx="79" cy="50" rx="10" ry="5.5" fill="#fff1d2" transform="rotate(12 79 50)"/>

    <!-- yeux -->
    <circle cx="49" cy="66" r="7" fill="#3b1d16"/>
    <circle cx="79" cy="66" r="7" fill="#3b1d16"/>
    <circle cx="51.5" cy="63.5" r="2.4" fill="#fff"/>
    <circle cx="81.5" cy="63.5" r="2.4" fill="#fff"/>
    <ellipse cx="64" cy="78" rx="5.8" ry="4.2" fill="#4b241b"/>
    <path d="M64 82c-3 4-7 5-10 1M64 82c3 4 7 5 10 1" fill="none" stroke="#4b241b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- fleur de cerisier Sakura, posée comme signature -->
  <g transform="translate(93 33) scale(.72)">
    <circle cx="0" cy="0" r="3.2" fill="#f2a13b"/>
    <path d="M0-5C-8-17 8-17 0-5Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="2"/>
    <path d="M5-1C18-8 14 9 5-1Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="2"/>
    <path d="M3 5C10 18-7 17 3 5Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="2"/>
    <path d="M-4 4C-18 10-14-8-4 4Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="2"/>
    <path d="M-5-1C-14-14-19 5-5-1Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="2"/>
  </g>

  <!-- petit plus mathématique lisible en favicon -->
  <g transform="translate(31 31)" stroke="#6656ba" stroke-width="6" stroke-linecap="round">
    <path d="M0 8h16M8 0v16"/>
  </g>
</svg>
