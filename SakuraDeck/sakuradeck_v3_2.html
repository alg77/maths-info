<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SakuraDeck 🌸 v0.3.2 — Assistant de deckbuilding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F9; --panel:#FFFFFF; --border:#F3D3E2; --border-soft:#F9E4EE;
  --ink:#4A3350; --ink-soft:#8A7391; --sakura:#E56A9C; --sakura-deep:#C94E82;
  --violet:#8E6DB5; --mint:#4FA98A; --mint-bg:#E8F6F0; --gold:#C08A2D; --gold-bg:#FBF1DD;
  --alert:#D96A5B; --alert-bg:#FCEAE6; --sky:#5E93C5; --sky-bg:#E9F2FA;
  --mW:#F0E0A8; --mU:#9FC4E8; --mB:#B7A8BE; --mR:#E89C8C; --mG:#A3C99A; --mC:#D8D2DC;
  --r:16px; --shadow:0 2px 12px rgba(201,78,130,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Baloo 2',cursive}
header{position:relative;overflow:hidden;background:linear-gradient(115deg,#FBE3EE 0%,#F3E6F7 60%,#FFF3E8 100%);border-bottom:2px solid var(--border);padding:16px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:1.65rem;font-weight:800;color:var(--sakura-deep)}
header h1 span{color:var(--violet)}
.tagline{color:var(--ink-soft);font-size:.88rem}
.hd-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.petal{position:absolute;top:-12px;font-size:14px;opacity:.5;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(120px) rotate(300deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.petal{display:none}}
button,.btn{font-family:'Baloo 2',cursive;font-weight:700;font-size:.84rem;border:2px solid var(--border);background:#fff;color:var(--sakura-deep);border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .12s, box-shadow .12s}
button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
button.primary{background:var(--sakura);border-color:var(--sakura);color:#fff}
button.mini{padding:3px 10px;font-size:.74rem}
button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
button:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
#progressWrap{padding:9px 26px;background:#FDF0F6;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--ink-soft)}
#progressBar{flex:1;height:9px;background:#F6DCE8;border-radius:999px;overflow:hidden}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--sakura),var(--violet));transition:width .3s}
.layout{display:grid;grid-template-columns:265px 1fr;gap:20px;padding:20px 26px;max-width:1440px;margin:0 auto}
@media (max-width:880px){.layout{grid-template-columns:1fr;padding:14px}}
aside .group-title{font-family:'Baloo 2';font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--violet);margin:14px 0 6px 4px}
.deck-item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--border-soft);border-radius:var(--r);padding:9px 12px;margin-bottom:7px;cursor:pointer;transition:border-color .15s}
.deck-item:hover{border-color:var(--sakura)}
.deck-item.active{border-color:var(--sakura);background:#FDF0F6;box-shadow:var(--shadow)}
.deck-item .emoji{font-size:1.25rem}
.deck-item .nm{font-family:'Baloo 2';font-weight:700;font-size:.9rem;line-height:1.15}
.deck-item .ct{font-size:.73rem;color:var(--ink-soft)}
.deck-item .score-mini{margin-left:auto;font-family:'Baloo 2';font-weight:800;font-size:.9rem;border-radius:999px;padding:2px 9px}
.panel{background:var(--panel);border:2px solid var(--border-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{color:var(--sakura-deep);font-size:1.12rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .sub{font-family:'Atkinson Hyperlegible';font-weight:400;font-size:.79rem;color:var(--ink-soft)}
/* bannière commandant */
.banner{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--border-soft);margin-bottom:18px;min-height:170px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.banner .art{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:saturate(1.05)}
.banner .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(74,51,80,0) 20%,rgba(74,51,80,.82) 100%)}
.banner .inner{position:relative;width:100%;display:flex;align-items:flex-end;gap:16px;padding:16px 20px;color:#fff}
.banner h2{font-size:1.5rem;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.banner .meta{font-size:.85rem;opacity:.92}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* score donut */
.donut-score{--p:0;--col:var(--sakura);width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:none}
.donut-score.on-light{background:conic-gradient(var(--col) calc(var(--p)*1%),#F6E9F0 0)}
.donut-score>i{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-style:normal;font-size:1.35rem;color:var(--ink)}
.donut-score>i small{font-size:.55rem;color:var(--ink-soft);display:block;text-align:center}
/* sous-scores */
.subscores{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.sub{background:#FDF4F8;border-radius:12px;padding:10px 12px}
.sub .t{display:flex;justify-content:space-between;font-family:'Baloo 2';font-weight:700;font-size:.85rem}
.sub .gauge{height:9px;background:#F1DEEA;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.sub .gauge i{display:block;height:100%;border-radius:999px}
.sub .d{font-size:.74rem;color:var(--ink-soft)}
/* priorités */
.prio{display:flex;gap:14px;background:linear-gradient(100deg,#FDF0F6,#F6EFFA);border:2px solid var(--border-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.prio .num{font-family:'Baloo 2';font-weight:800;font-size:1.7rem;color:var(--sakura);flex:none}
.prio h3{font-size:1rem;color:var(--sakura-deep)}
.prio .why{font-size:.86rem;margin:4px 0}
.prio .gain{font-size:.8rem;color:var(--mint);font-weight:700}
.prio .swap{font-size:.85rem;margin-top:6px}
.prio .swap b{color:var(--violet)}
/* cartes visuelles */
.cardline{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px dashed var(--border-soft);font-size:.9rem;flex-wrap:wrap}
.cardline:hover{background:#FDF4F8;border-radius:8px}
.cardline .thumb{width:34px;height:47px;border-radius:5px;object-fit:cover;background:#F1DEEA;flex:none}
.cardline .nm{font-weight:700;position:relative;cursor:help}
.cardline .nm img.zoom{display:none;position:absolute;z-index:50;left:0;top:130%;width:210px;border-radius:10px;box-shadow:0 8px 24px rgba(74,51,80,.35)}
.cardline .nm:hover img.zoom{display:block}
.cardline .type{color:var(--ink-soft);font-size:.78rem;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardline .price{font-weight:700;color:var(--gold);min-width:58px;text-align:right}
.badge{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge.free{background:var(--mint-bg);color:var(--mint)}
.badge.role{background:#F1E8F8;color:var(--violet)}
.badge.owned{background:var(--gold-bg);color:var(--gold)}
.badge.warn{background:var(--alert-bg);color:var(--alert)}
.badge.sky{background:var(--sky-bg);color:var(--sky)}
.badge.ip{background:#FFF;border:1.5px solid var(--gold);color:var(--gold)}
.reason{font-size:.77rem;color:var(--ink-soft);width:100%;padding-left:44px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{font-family:'Baloo 2';font-weight:700;font-size:.85rem;border:2px solid var(--border);border-radius:999px;padding:6px 14px;background:#fff;color:var(--ink-soft);cursor:pointer}
.tab.active{background:var(--violet);border-color:var(--violet);color:#fff}
.chip{font-family:'Baloo 2';font-weight:700;font-size:.78rem;border:2px solid var(--border);border-radius:999px;padding:4px 12px;background:#fff;color:var(--ink-soft);cursor:pointer}
.chip.active{background:var(--sakura);border-color:var(--sakura);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.sec-title{font-family:'Baloo 2';font-weight:800;color:var(--violet);margin:16px 0 6px;font-size:.95rem}
.hint{font-size:.8rem;color:var(--ink-soft);font-style:italic}
.empty{padding:24px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:2.3rem}
/* today */
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.action-card{background:var(--panel);border:2px solid var(--border-soft);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.action-card h3{font-size:1rem;color:var(--sakura-deep);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.action-card .go{margin-top:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.kpi{background:#FDF4F8;border-radius:10px;padding:8px 12px;text-align:center;flex:1;min-width:88px}
.kpi .v{font-family:'Baloo 2';font-weight:800;font-size:1.2rem;color:var(--violet)}
.kpi .l{font-size:.68rem;color:var(--ink-soft)}
/* courbe & comparateur */
.curve{display:flex;align-items:flex-end;gap:7px;height:130px;padding-top:24px}
.curve .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.curve .bar .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.curve .bar i{width:16px;background:linear-gradient(180deg,#C9A6E0,var(--violet));border-radius:6px 6px 3px 3px;position:relative;min-height:3px}
.curve .bar i.after{background:linear-gradient(180deg,#F2B8CF,var(--sakura))}
.curve .bar i b{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--violet)}
.curve .bar .lbl{font-size:.75rem;color:var(--ink-soft);margin-top:4px;font-weight:700}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.compare-grid{grid-template-columns:1fr}}
.delta{font-weight:800;font-family:'Baloo 2'}
.delta.up{color:var(--mint)}.delta.down{color:var(--alert)}
/* formulaires parties */
select,input[type=number],input[type=text],textarea{font-family:inherit;font-size:.88rem;color:var(--ink);border:2px solid var(--border-soft);border-radius:10px;padding:7px 10px;background:#FFFDFE}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.game-line{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--border-soft);font-size:.86rem;flex-wrap:wrap}
footer{text-align:center;color:var(--ink-soft);font-size:.78rem;padding:16px}
/* v0.3.2 — tri + cartes visuelles + plan conseillé */
.sortbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.sortbar .chip{font-size:.72rem;padding:3px 9px}
.cardline.visual{align-items:flex-start;background:#FFFDFE;border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px;padding:9px}
.cardline.visual .thumb{width:52px;height:72px;border-radius:7px}
.cardline.visual .reason{padding-left:62px}
@media(max-width:760px){.cardline.visual .reason{padding-left:0;width:100%}}
.swaprow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:10px 0}
@media(max-width:620px){.swaprow{grid-template-columns:1fr}.swaprow .arrow{text-align:center}}
.swapcard{border:1px solid var(--border-soft);background:#FDF4F8;border-radius:12px;padding:10px;min-height:100%}
.swapcard.add{background:var(--mint-bg)}.swapcard.cut{background:var(--alert-bg)}
.swapcard .top{display:flex;gap:8px;align-items:flex-start}.swapcard img{width:42px;height:58px;border-radius:6px;object-fit:cover;background:#F1DEEA}.swapcard b{display:block;line-height:1.15}.swapcard small{color:var(--ink-soft)}
.swaprow .arrow{font-family:'Baloo 2';font-weight:800;color:var(--violet);align-self:center}
.costline{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.debugbox{font-family:monospace;font-size:.75rem;background:#fff;border:1px dashed var(--border);border-radius:10px;padding:8px;white-space:pre-wrap;max-height:180px;overflow:auto}

</style>
</head>
<body>

<header>
  <div>
    <h1>Sakura<span>Deck</span> 🌸🐾 <span style="font-size:.8rem;color:var(--violet)">v0.3.2</span></h1>
    <div class="tagline">Ton assistante de deckbuilding : d'abord ce que tu possèdes, ensuite les achats les plus rentables.</div>
  </div>
  <div class="hd-actions">
    <button id="btnSave" disabled title="Sauvegarde cache Scryfall + plans d'optimisation + parties">💾 Sauver ma session</button>
    <button id="btnWishlist" disabled title="Exporte tous les achats planifiés (liste compatible import Cardmarket)">📝 Wishlist</button>
    <label class="btn">📂 Charger une session<input type="file" id="sessionInput" accept=".json" hidden></label>
    <label class="btn">🔄 Nouveau CSV ManaBox<input type="file" id="csvInput" accept=".csv" hidden></label>
  </div>
</header>

<div id="progressWrap">
  <span id="progressTxt">🐼 Préparation…</span>
  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"><div class="panel empty"><div class="big">🌰</div>Chargement des cartes via Scryfall…</div></main>
</div>

<footer>SakuraDeck v0.3.2 · données & recos : Scryfall, EDHREC, MTGJSON · prix Cardmarket · collection : ManaBox 🦊</footer>

function normalizeCard(c){

  return{id:c.id,name:c.name,cmc:c.cmc??0,type:c.type_line||f.type_line||"",oracle,
    ci:(c.color_identity||[]).join(""),eur:c.prices?.eur?+c.prices.eur:null,

    rank:c.edhrec_rank??null,mana:f.mana_cost||c.mana_cost||""};
}
function roles(card){
  const t=card.type,o=card.oracle||"",tags=[];
  if(/\bLand\b/.test(t)){tags.push("Terrain");return tags;}
  if(/search (your|their) librar(y|ies) for .{0,40}land/i.test(o)||/add \{[WUBRGC0-9]/i.test(o))tags.push("Ramp");
  if(/draws? (a card|one|two|three|four|X|that many|cards)/i.test(o))tags.push("Pioche");
  if(/(destroy|exile) all/i.test(o)||/each (creature|player sacrifices)/i.test(o)&&/destroy|damage/i.test(o))tags.push("Wipe");
  else if(/(destroy|exile)s? (target|up to|another target)/i.test(o)||/deals? \d+ damage to (any target|target creature)/i.test(o))tags.push("Removal");
  if(/counter target/i.test(o))tags.push("Contre");
  if(/(hexproof|indestructible|protection from|phases? out|can't be (the )?target)/i.test(o))tags.push("Protection");
  if(/search your library for a card/i.test(o))tags.push("Tuteur");
  return tags;
}

/* hypergéométrique */
function logC(n,k){let s=0;for(let i=0;i<k;i++)s+=Math.log(n-i)-Math.log(i+1);return s;}
function hyp(N,K,n,k){if(k<0||k>n||k>K||n-k>N-K)return 0;return Math.exp(logC(K,k)+logC(N-K,n-k)-logC(N,n));}
function pLandsBetween(N,L,lo,hi){let p=0;for(let k=lo;k<=hi;k++)p+=hyp(N,L,7,k);return p;}

function themeOf(entries){
  const sub={},kw={counters:0,equip:0};let creatures=0;
  for(const e of entries){const c=DB[keyOf(e)];if(!c)continue;
    if(/\+1\/\+1 counter/i.test(c.oracle))kw.counters+=e.q;
    if(/Equip/i.test(c.oracle)&&/Equipment/.test(c.type))kw.equip+=e.q;
    if(/Creature/.test(c.type)){creatures+=e.q;const m=c.type.split("—")[1];
      if(m)m.trim().split(/\s+/).forEach(st=>{if(st&&st!=="//")sub[st]=(sub[st]||0)+e.q;});}}
  let best=null,bv=0;for(const[k,v]of Object.entries(sub))if(v>bv){bv=v;best=k;}
  if(bv>=8)return{kind:"tribal",name:best,count:bv,test:c=>new RegExp("\\b"+best+"\\b").test(c.type)||new RegExp(best,"i").test(c.oracle)};
  if(kw.counters>=12)return{kind:"kw",name:"Compteurs +1/+1",count:kw.counters,test:c=>/\+1\/\+1 counter/i.test(c.oracle)};
  if(kw.equip>=7)return{kind:"kw",name:"Équipements",count:kw.equip,test:c=>/Equipment/.test(c.type)||/equipped/i.test(c.oracle)};
  return null;
}

    A.tagged.push({e,c,tg,price});}
  A.theme=themeOf(entries);
  A.themeCount=A.theme?entries.reduce((a,e)=>{const c=DB[keyOf(e)];return a+((c&&A.theme.test(c))?e.q:0);},0):0;
  A.avgCmc=A.nonland?A.cmcSum/A.nonland:0;
  A.entries=entries;
  return A;
}
function subScores(A){
  const S={},sc=A.scale;
  const ratio=(v,t)=>t?Math.min(1,v/t):1;
  S.manabase={r:ratio(A.lands,Math.round(CATS.manabase.t*sc)),v:A.lands,t:Math.round(CATS.manabase.t*sc)};
  S.ramp={r:ratio(A.cnt.ramp,Math.round(CATS.ramp.t*sc)),v:A.cnt.ramp,t:Math.round(CATS.ramp.t*sc)};
  S.pioche={r:ratio(A.cnt.pioche,Math.round(CATS.pioche.t*sc)),v:A.cnt.pioche,t:Math.round(CATS.pioche.t*sc)};
  S.removal={r:ratio(A.cnt.removal,Math.round(CATS.removal.t*sc)),v:A.cnt.removal,t:Math.round(CATS.removal.t*sc)};
  S.wipes={r:ratio(A.cnt.wipes,Math.max(1,Math.round(CATS.wipes.t*sc))),v:A.cnt.wipes,t:Math.max(1,Math.round(CATS.wipes.t*sc))};
  S.protection={r:ratio(A.cnt.protection,Math.round(CATS.protection.t*sc)),v:A.cnt.protection,t:Math.round(CATS.protection.t*sc)};
  S.synergies=A.theme?{r:ratio(A.themeCount,Math.round(CATS.synergies.t*sc)),v:A.themeCount,t:Math.round(CATS.synergies.t*sc),name:A.theme.name}
                     :{r:0.55,v:0,t:0,name:null};
  const heavyShare=A.nonland?A.heavy/A.nonland:0;
  S.courbe={r:Math.max(0,Math.min(1,1-Math.abs(A.avgCmc-3.0)/2.2-Math.max(0,heavyShare-0.12)*2)),v:A.avgCmc.toFixed(1),t:"≈3,0"};
  const pGood=pLandsBetween(A.size,A.lands,2,5);
  S.regularite={r:Math.min(1,pGood/0.82),v:pct(pGood),t:"≥ 82 %",p:pGood};
  let g=0;for(const k in S)g+=wOf(A,k)*S[k].r;
  return{subs:S,global:Math.round(g)};
}
function analyzeDeck(name){
  if(ANALYSES[name])return ANALYSES[name];
  const A=analyzeEntries(deckEntries(name));
  A.name=name;A.W=weightsFor(name);A.score=subScores(A);
  A.ci=[...new Set(A.tagged.flatMap(t=>[...t.c.ci]))].join("");
  A.commander=NAME_DB[COMMANDER_HINTS[name]]||A.tagged.find(t=>/Legendary/.test(t.c.type)&&/Creature/.test(t.c.type))?.c||null;
  return ANALYSES[name]=A;
}
function invalidate(name){delete ANALYSES[name];}

/* pondération apprise des parties (>=2 défaites même cause → la catégorie pèse +30 %) */
function weightsFor(name){
  const W={};for(const k in CATS)W[k]=CATS[k].w;
  const cnt={};GAMES.filter(g=>g.deck===name&&!g.win&&g.reason).forEach(g=>cnt[g.reason]=(cnt[g.reason]||0)+1);
  let adj=false;
  for(const[r,n]of Object.entries(cnt))if(n>=2&&REASON_TO_CAT[r]){W[REASON_TO_CAT[r]]*=1.3;adj=true;}
  const tot=Object.keys(CATS).reduce((a,k)=>a+W[k],0);
  for(const k in CATS)W[k]=W[k]*100/tot;
  W._adjusted=adj;return W;
}
const wOf=(A,k)=>(A&&A.W)?A.W[k]:CATS[k].w;

/* impact d'un ajout (en points de score) */
function impactOf(card,A){
  const S=A.score.subs,sc=A.scale,tg=roles(card);let pts=0;const why=[];
  const marg=(key,label)=>{const t=Math.max(1,Math.round(CATS[key].t*sc));
    const boost=S[key].r<0.6?2:(S[key].r<1?1.4:0.25);
    const p=CATS[key].w/t*boost;pts+=p;
    why.push(label+(S[key].r<1?" (déficit "+S[key].v+"/"+S[key].t+")":""));};
  if(tg.includes("Ramp"))marg("ramp","ramp");
  if(tg.includes("Pioche"))marg("pioche","pioche");
  if(tg.includes("Removal")||tg.includes("Contre"))marg("removal","réponse");
  if(tg.includes("Wipe"))marg("wipes","wipe");
  if(tg.includes("Protection"))marg("protection","protection");
  if(A.theme&&A.theme.test(card)){const t=Math.max(1,Math.round(CATS.synergies.t*sc));
    pts+=CATS.synergies.w/t*(S.synergies.r<1?1.6:0.4);why.push("synergie "+A.theme.name+" 💕");}
  if(card.rank&&card.rank<3000){pts+=0.3;why.push("staple EDHREC #"+card.rank);}
  return{pts,why,tg};
}
/* candidates à la sortie, avec explication */
function cutCandidates(A){
  return A.tagged
    .filter(t=>!t.tg.includes("Terrain")&&t.tg.length===0&&t.c.cmc>=4&&(!t.c.rank||t.c.rank>12000)&&(!A.theme||!A.theme.test(t.c)))
    .map(t=>({...t,why:`CMC ${t.c.cmc}, aucun rôle structurel${t.c.rank?", EDHREC #"+t.c.rank:""} — la retirer allège la courbe (coût moyen −${(t.c.cmc>A.avgCmc?((t.c.cmc-A.avgCmc)/Math.max(1,A.nonland)).toFixed(2):"0,00")})`}))
    .sort((a,b)=>(b.c.rank||99999)-(a.c.rank||99999));
}
/* suggestions gratuites (classeurs) */
function ownedSuggestions(A,limit=40){
  const inDeck=new Set(A.tagged.map(t=>t.c.name)),pool={};
  for(const r of COLLECTION){
    if(r.b===A.name||r.t==="deck")continue;
    const c=DB[keyOf(r)];if(!c||inDeck.has(c.name)||pool[c.name])continue;
    if(!ciSubset(c.ci,A.ci))continue;
    const imp=impactOf(c,A);if(imp.pts<0.5)continue;
    pool[c.name]={c,imp,from:r.b};}
  return Object.values(pool).sort((a,b)=>b.imp.pts-a.imp.pts).slice(0,limit);
}
/* achats (staples non possédées) */
function buySuggestions(A){
  const ownedNames=new Set(COLLECTION.map(r=>DB[keyOf(r)]?.name).filter(Boolean));
  const inDeck=new Set(A.tagged.map(t=>t.c.name));
  const pool={};
  for(const s of STAPLES)if(ciSubset(s.ci,A.ci))pool[s.n]={r:s.r,edh:null};
  for(const rec of (EDHREC[A.name]||[])){
    const c=NAME_DB[rec.n];if(!c||!ciSubset(c.ci,A.ci))continue;
    if(!pool[rec.n])pool[rec.n]={r:rec.label,edh:rec};else pool[rec.n].edh=rec;
  }
  return Object.entries(pool).map(([n,info])=>{
    const c=NAME_DB[n];
    if(!c||ownedNames.has(n)||inDeck.has(n))return null;
    const imp=impactOf(c,A);
    if(info.edh){const b=Math.min(1.5,(info.edh.inc||0)/40+Math.max(0,info.edh.syn||0));
      if(b>0.05){imp.pts+=b;imp.why.push("reco EDHREC"+(info.edh.inc?" · jouée dans "+info.edh.inc+"% des decks "+(A.commander?A.commander.name.split(",")[0]:""):""));}}
    return{s:{r:info.r,n},c,imp,ip:imp.pts/Math.max(0.5,c.eur||0.5),edh:info.edh};
  }).filter(x=>x&&x.c.eur!=null&&x.imp.pts>=0.4).sort((a,b)=>b.ip-a.ip);
}
/* top 3 priorités */
function priorities(A){
  const S=A.score.subs;
  const gaps=Object.keys(CATS).map(k=>({k,lost:wOf(A,k)*(1-S[k].r)})).sort((a,b)=>b.lost-a.lost).slice(0,3).filter(g=>g.lost>0.8);
  const owned=ownedSuggestions(A,60),buys=buySuggestions(A),cuts=cutCandidates(A);
  const matches=(x,k)=>{const tg=x.imp.tg;
    return(k==="ramp"&&tg.includes("Ramp"))||(k==="pioche"&&tg.includes("Pioche"))||
    (k==="removal"&&(tg.includes("Removal")||tg.includes("Contre")))||(k==="wipes"&&tg.includes("Wipe"))||
    (k==="protection"&&tg.includes("Protection"))||(k==="synergies"&&A.theme&&A.theme.test(x.c))||
    (k==="manabase"&&/\bLand\b/.test(x.c.type))||(k==="courbe"&&x.c.cmc<=2)||(k==="regularite"&&(/\bLand\b/.test(x.c.type)||tg.includes("Ramp")));};
  return gaps.map((g,i)=>{
    const own=owned.find(x=>matches(x,g.k)),buy=buys.find(x=>matches(x,g.k)),cut=cuts[i];
    return{rank:i+1,k:g.k,lost:g.lost,S:S[g.k],own,buy,cut};});
}

/* ============ INVESTISSEMENTS INTELLIGENTS ============ */
function smartInvest(){
  const decks=groupsOf().decks.map(analyzeDeck);
  const cands={}; // name -> {c, owned, from, perDeck:[{deck,pts,why}]}
  const consider=(c,owned,from,price)=>{
    for(const A of decks){
      if(A.tagged.some(t=>t.c.name===c.name))continue;
      if(!ciSubset(c.ci,A.ci))continue;
      const imp=impactOf(c,A);if(imp.pts<0.5)continue;
      const e=cands[c.name]||(cands[c.name]={c,owned,from,price,perDeck:[]});
      e.perDeck.push({deck:A.name,pts:imp.pts,why:imp.why});}}
  const seen=new Set();
  for(const r of COLLECTION){if(r.t==="deck")continue;const c=DB[keyOf(r)];
    if(!c||seen.has(c.name))continue;seen.add(c.name);consider(c,true,r.b,0);}
  for(const s of STAPLES){const c=NAME_DB[s.n];if(!c||seen.has(s.n))continue;
    const inColl=COLLECTION.some(r=>DB[keyOf(r)]?.name===s.n);
    consider(c,inColl,inColl?"collection":null,inColl?0:(c.eur??null));}
  return Object.values(cands).map(e=>{
    e.total=e.perDeck.reduce((a,d)=>a+d.pts,0);e.n=e.perDeck.length;
    e.ip=e.owned?Infinity:e.total/Math.max(0.5,e.price||0.5);return e;})
    .sort((a,b)=>b.total-a.total);
}

/* ============ SIMULATEUR (Monte-Carlo) ============ */
function buildSimDeck(A){
  const deck=[];
  for(const t of A.tagged){const isLand=t.tg.includes("Terrain");
    for(let i=0;i<t.e.q;i++)deck.push({land:isLand,cmc:t.c.cmc,ramp2:!isLand&&t.tg.includes("Ramp")&&t.c.cmc<=2});}
  return deck;
}
function simulate(A,iters=4000){
  const deck=buildSimDeck(A),N=deck.length;
  const cmdCost=Math.min(6,A.commander?A.commander.cmc:4);
  let rawScrew=0,screw=0,flood=0,ramp2=0,cmdT4=0,mulls=0,land3T3=0;const dist=[0,0,0,0,0,0,0,0];
  const shuffle=()=>{for(let i=N-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=deck[i];deck[i]=deck[j];deck[j]=t;}};
  const landsIn=(n)=>{let l=0;for(let i=0;i<Math.min(n,N);i++)if(deck[i].land)l++;return l;};
  for(let it=0;it<iters;it++){
    shuffle();let l7=landsIn(7);
    if(l7<=1||l7>=6)rawScrew+=(l7<=1?1:0); // main naturelle
    let tries=0;
    while(tries<2&&(l7<=1||l7>=6)){shuffle();l7=landsIn(7);tries++;} // mulligans (simplifiés)
    mulls+=tries;
    dist[Math.min(l7,7)]++;
    if(l7<=1)screw++;if(l7>=5)flood++;
    let r2=0;for(let i=0;i<7;i++)if(deck[i].ramp2)r2++;
    if(r2>=1)ramp2++;
    if(landsIn(9)>=3)land3T3++;
    let l10=Math.min(landsIn(10),4),rk=0;
    for(let i=0;i<Math.min(10,N);i++)if(!deck[i].land&&deck[i].ramp2)rk++;
    if(l10+rk>=cmdCost)cmdT4++;}
  return{iters,dist:dist.map(d=>d/iters),rawScrew:rawScrew/iters,screw:screw/iters,flood:flood/iters,
    ramp2:ramp2/iters,cmdT4:cmdT4/iters,cmdCost,avgMulls:mulls/iters,land3T3:land3T3/iters};
}

/* ============ SCRYFALL ============ */
async function fetchBatches(identifiers,label,chunk=50){
  const found=[];
  async function fetchChunk(slice){
    const res=await fetch("https://api.scryfall.com/cards/collection",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({identifiers:slice})});
    if(!res.ok){
      const msg=await res.text().catch(()=>"");
      if((res.status===400||res.status===413||msg.toLowerCase().includes("maximum"))&&slice.length>1){
        const mid=Math.ceil(slice.length/2);
        await fetchChunk(slice.slice(0,mid));
        await fetchChunk(slice.slice(mid));
        return;
      }
      throw new Error("HTTP "+res.status+" "+msg.slice(0,120));
    }
    ((await res.json()).data||[]).forEach(c=>found.push(c));
    await sleep(120);
  }
  for(let i=0;i<identifiers.length;i+=chunk){
    setProgress(label,i,identifiers.length);
    await fetchChunk(identifiers.slice(i,i+chunk));
  }
  setProgress(label,identifiers.length,identifiers.length);
  return found;
}
async function hydrate(){
  try{
    const need=[...new Map(COLLECTION.map(e=>[keyOf(e),e])).values()].filter(e=>!DB[keyOf(e)]);
    const byId=need.filter(e=>e.id).map(e=>({id:e.id}));
    const byCn=need.filter(e=>!e.id);
    if(byId.length)(await fetchBatches(byId,"🌱 Cartes de la collection")).forEach(raw=>{const c=normalizeCard(raw);DB[c.id]=c;NAME_DB[c.name]=c;});
    if(byCn.length)(await fetchBatches(byCn.map(e=>({set:e.s.toLowerCase(),collector_number:e.cn})),"📦 Cartes des précos")).forEach(raw=>{const c=normalizeCard(raw);DB[raw.set.toUpperCase()+"/"+raw.collector_number]=c;NAME_DB[c.name]=c;});
    const missing=STAPLES.filter(s=>!NAME_DB[s.n]).map(s=>({name:s.n}));
    if(missing.length)(await fetchBatches(missing,"🛒 Prix des staples")).forEach(raw=>{const c=normalizeCard(raw);NAME_DB[c.name]=c;});
    ready();
  }catch(err){scryfallError(err);}
}
async function scryfallError(err){
  $("#progressTxt").textContent="😿 Scryfall injoignable — diagnostic en cours…";
  const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  let getOK=false;
  try{const r=await fetch("https://api.scryfall.com/cards/named?exact=Sol+Ring");getOK=r.ok;}catch(e){}
  let diag;
  if(inFrame)diag=`🖼️ <b>Tu es dans un aperçu intégré (Claude ?)</b> : les appels externes y sont bloqués. Télécharge le fichier et ouvre-le directement dans ton navigateur (double-clic → Chrome/Firefox).`;
  else if(getOK)diag=`🤔 Les requêtes simples (GET) passent mais pas les requêtes groupées (POST) : c'est typiquement un <b>bloqueur de pub / extension de confidentialité</b> (uBlock, Brave Shields, Ghostery…). Désactive-le pour ce fichier, ou utilise le 🐢 mode secours ci-dessous qui n'utilise que des requêtes simples.`;
  else diag=`🚧 Aucune requête ne passe : <b>bloqueur de pub, antivirus, pare-feu… ou réseau filtré</b> (réseau d'établissement scolaire par exemple 😉). Essaie un autre navigateur, un autre réseau (partage de connexion du téléphone), ou la solution session ci-dessous.`;
  $("#progressTxt").textContent="😿 Scryfall injoignable.";
  $("#main").innerHTML=`<div class="panel"><h2>😿 Impossible de joindre Scryfall</h2>
  <p class="hint">Erreur technique : ${esc(err.message||String(err))}</p>
  <p style="margin-top:10px">${diag}</p>
  <p style="margin-top:12px">📱 <b>Contournement fiable :</b> ouvre ce même fichier sur un appareil où ça fonctionne (ton téléphone !), fais « 💾 Sauver ma session », envoie-toi le fichier JSON, puis « 📂 Charger une session » ici : tout fonctionne alors <b>hors-ligne</b>, recos EDHREC comprises.</p>
  <p style="margin-top:12px"><button class="primary" id="btnRetry">🔁 Réessayer</button>
  ${getOK?`<button id="btnSlow">🐢 Mode secours (requêtes simples, ~2 min)</button>`:""}</p></div>`;
  $("#btnRetry").addEventListener("click",hydrate);
  const bs=document.getElementById("btnSlow");if(bs&&bs.addEventListener)bs.addEventListener("click",hydrateSlow);
}

/* Mode secours : hydratation carte par carte en GET (contourne les blocages de POST) */
async function hydrateSlow(){
  try{
    const need=[...new Map(COLLECTION.map(e=>[keyOf(e),e])).values()].filter(e=>!DB[keyOf(e)]);
    let done=0;
    for(const e of need){

                    :("https://api.scryfall.com/cards/"+e.s.toLowerCase()+"/"+encodeURIComponent(e.cn));
      try{

    }
    for(const s of STAPLES){
      if(NAME_DB[s.n])continue;

        if(r.ok){const c=normalizeCard(await r.json());NAME_DB[c.name]=c;}}catch(x){}

/* ============ EDHREC ============ */
function edhrecSlug(n){return n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['\u2019,."]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
let EDHREC_LOADING=false;
async function loadEdhrecAll(){
  if(EDHREC_LOADING)return;EDHREC_LOADING=true;
  try{
    for(const d of groupsOf().decks){
      const A=analyzeDeck(d);if(!A.commander||EDHREC[d])continue;
      try{
        const res=await fetch("https://json.edhrec.com/pages/commanders/"+edhrecSlug(A.commander.name)+".json");
        if(!res.ok)throw 0;
        const j=await res.json();
        const lists=(j.container&&j.container.json_dict&&j.container.json_dict.cardlists)||[];
        const recs=[];
        for(const L of lists)for(const cv of (L.cardviews||[]).slice(0,18))
          recs.push({n:cv.name,label:L.header||"Reco EDHREC",inc:(cv.num_decks&&cv.potential_decks)?Math.round(100*cv.num_decks/cv.potential_decks):null,syn:cv.synergy??null});
        EDHREC[d]=recs.slice(0,80);
      }catch(e){/* silencieux : staples en secours */}
      await sleep(150);
    }
    const unknown=[...new Set(Object.values(EDHREC).flat().map(r=>r.n))].filter(n=>!NAME_DB[n]).slice(0,225);
    if(unknown.length)(await fetchBatches(unknown.map(n=>({name:n})),"🔮 Prix des recos EDHREC")).forEach(raw=>{const c=normalizeCard(raw);NAME_DB[c.name]=c;});

/* ============ NOUVEAU CSV ============ */
$("#csvInput").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{COLLECTION=parseManaBoxCSV(rd.result);DB={};NAME_DB={};ANALYSES={};hydrate();}catch(err){alert("CSV illisible : "+err.message);}};rd.readAsText(f);});
function parseManaBoxCSV(text){
  const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  const head=splitCSV(lines[0]);const ix=k=>head.indexOf(k);const out=[];
  for(let i=1;i<lines.length;i++){const c=splitCSV(lines[i]);if(c.length<5)continue;
    out.push({b:(c[ix("Binder Name")]||"").trim(),t:c[ix("Binder Type")],n:(c[ix("Name")]||"").trim(),
      s:c[ix("Set code")],cn:c[ix("Collector number")],f:c[ix("Foil")]==="foil"?1:0,
      q:parseInt(c[ix("Quantity")]||"1"),id:c[ix("Scryfall ID")],l:c[ix("Language")]});}
  return out;}
function splitCSV(line){const out=[];let cur="",q=false;
  for(const ch of line){if(ch==='"'){q=!q;continue;}if(ch===','&&!q){out.push(cur);cur="";continue;}cur+=ch;}
  out.push(cur);return out;}

function sortedDeckNames(decks){
  const score=(n)=>Object.keys(DB).length?analyzeDeck(n).score.global:0;
  const value=(n)=>Object.keys(DB).length?analyzeDeck(n).value:0;
  return [...decks].sort((a,b)=>{
    if(DECK_SORT==="scoreAsc")return score(a)-score(b)||a.localeCompare(b);
    if(DECK_SORT==="scoreDesc")return score(b)-score(a)||a.localeCompare(b);
    if(DECK_SORT==="valueDesc")return value(b)-value(a)||a.localeCompare(b);

    return a.localeCompare(b,"fr");
  });
}

  if(!P.addOwned.length&&!P.buys.length&&!P.cuts.length)return null;
  const cuts=new Set(P.cuts);
  const entries=deckEntries(name).filter(e=>!cuts.has(DB[keyOf(e)]?.name));
  const adds=[...P.addOwned,...P.buys].map(n=>NAME_DB[n]).filter(Boolean)
    .map(c=>{if(!DB[c.id])DB[c.id]=c;return{id:c.id,q:1,f:0};});
  const A=analyzeEntries([...entries,...adds]);A.name=name;A.W=weightsFor(name);A.score=subScores(A);
  A.ci=[...new Set(A.tagged.flatMap(t=>[...t.c.ci]))].join("");A.commander=analyzeDeck(name).commander;
  return A;
}

function optimizationPairs(A,limit=8){

  const adds=[...owned,...buys].sort((a,b)=>b.imp.pts-a.imp.pts);

  return adds.slice(0,limit).map((add,i)=>({add,cut:cuts[i]||null,net:(add.imp.pts-(cuts[i]?.c?.cmc>A.avgCmc?0.2:0)).toFixed(1)}));

  <p class="hint">Ce plan donne des couples “remplacer X par Y”. Les retraits sont des candidates statistiques : garde toujours une carte coup de cœur si elle raconte ton histoire 💕.</p>
  ${pairs.map((p,idx)=>{const a=p.add.c,cut=p.cut?.c;return`<div class="swaprow">
    <div class="swapcard add"><div class="top">${a.img?`<img loading="lazy" src="${a.img}">`:""}<div><b>+ ${esc(a.name)}</b><small>${esc(a.type||"")}</small><br><span class="badge ${p.add.kind==="owned"?"free":"owned"}">${p.add.kind==="owned"?"déjà dans ta collection · "+esc(p.add.from||""):"achat · "+eur(a.eur||0)}</span> <span class="badge role">+${p.add.imp.pts.toFixed(1)} pt</span></div></div><div class="reason" style="padding-left:0;margin-top:6px">${p.add.imp.why.join(" · ")}</div><button class="mini" data-${p.add.kind==="owned"?"add-own":"add-buy"}="${esc(a.name)}">➕ Ajouter au plan</button></div>
    <div class="arrow">⇄</div>
    <div class="swapcard cut"><div class="top">${cut&&cut.img?`<img loading="lazy" src="${cut.img}">`:""}<div><b>${cut?"− "+esc(cut.name):"− à choisir"}</b><small>${cut?esc(cut.type||""):"aucune candidate évidente"}</small><br>${cut?`<span class="badge warn">sortie proposée</span>`:""}</div></div>${cut?`<div class="reason" style="padding-left:0;margin-top:6px">${esc(p.cut.why||"")}</div><button class="mini" data-cut="${esc(cut.name)}">✂️ Retirer au plan</button>`:`<div class="reason" style="padding-left:0;margin-top:6px">Ajoute la carte sans retrait automatique, ou choisis une carte que tu joues peu.</div>`}</div>
  </div>`}).join("")||`<div class="empty">Pas encore assez de données pour proposer un plan.</div>`}</div>`;
  bindPlanButtons(A.name,z);
}
function bindPlanButtons(name,z){
  z.querySelectorAll("[data-add-own]").forEach(b=>b.addEventListener("click",()=>{const P=planOf(name);
    if(!P.addOwned.includes(b.dataset.addOwn))P.addOwned.push(b.dataset.addOwn);autoStore();TAB="compare";renderDeck(name);}));
  z.querySelectorAll("[data-add-buy]").forEach(b=>b.addEventListener("click",()=>{const P=planOf(name);
    if(!P.buys.includes(b.dataset.addBuy))P.buys.push(b.dataset.addBuy);autoStore();TAB="compare";renderDeck(name);}));
  z.querySelectorAll("[data-cut]").forEach(b=>b.addEventListener("click",()=>{const P=planOf(name);
    if(!P.cuts.includes(b.dataset.cut))P.cuts.push(b.dataset.cut);autoStore();TAB="compare";renderDeck(name);}));
}
function tabGratuit(A,z){
  const list=ownedSuggestions(A);
  z.innerHTML=`<div class="panel"><h2>✨ J'ai déjà ! <span class="sub">0 € — juste des pochettes à déplacer</span></h2>
  ${list.map(s=>`<div class="cardline visual">
    ${s.c.img?`<img class="thumb" loading="lazy" src="${s.c.img}">`:`<span class="thumb"></span>`}
    <span class="nm">${esc(s.c.name)}${s.c.img?`<img class="zoom" src="${s.c.img}">`:""}</span>
    <span class="type">${esc(s.c.type)}</span>
    <span class="badge free">gratuit · ${esc(s.from)}</span>
    <span class="badge role">+${s.imp.pts.toFixed(1)} pt</span>
    <button class="mini" data-add-own="${esc(s.c.name)}">➕ au plan</button>
    <span class="reason">→ ${s.imp.why.join(" · ")}</span></div>`).join("")||`<div class="empty">Rien de compatible dans tes classeurs — vois 🛒 !</div>`}</div>`;
  bindPlanButtons(A.name,z);
}
function tabAchats(A,z){
  const buys=buySuggestions(A);
  const budgets=[[0,"0 € (gratuit)"],[5,"≤ 5 €"],[10,"≤ 10 €"],[20,"≤ 20 €"],[50,"≤ 50 €"],[Infinity,"Illimité"]];
  const P=planOf(A.name);
  const planned=P.buys.map(n=>NAME_DB[n]).filter(Boolean);
  const cum=planned.reduce((a,c)=>a+(c.eur||0),0);
  const list=BUDGET===0?[]:buys.filter(x=>x.c.eur<=BUDGET);
  z.innerHTML=`<div class="panel"><h2>🛒 Achats malins <span class="sub">prix Cardmarket en direct · classés par ⚡ impact/prix</span></h2>
  <div class="chips">${budgets.map(b=>`<button class="chip ${BUDGET===b[0]?"active":""}" data-b="${b[0]}">${b[1]}</button>`).join("")}</div>
  <div class="kpis"><div class="kpi"><div class="v">${planned.length}</div><div class="l">achats au plan</div></div>
  <div class="kpi"><div class="v">${eur(cum)}</div><div class="l">budget cumulé du plan</div></div></div>
  ${BUDGET===0?`<p class="hint">Budget 0 € : tout se passe dans l'onglet ✨ J'ai déjà ! — le meilleur magasin, c'est tes classeurs 🌸</p>`:""}
  ${list.map(x=>`<div class="cardline visual">
    ${x.c.img?`<img class="thumb" loading="lazy" src="${x.c.img}">`:`<span class="thumb"></span>`}
    <span class="nm">${esc(x.c.name)}${x.c.img?`<img class="zoom" src="${x.c.img}">`:""}</span>
    <span class="type">${esc(x.c.type)}</span>
    <span class="badge role">${esc(x.s.r)}</span>
    ${x.edh&&x.edh.inc?`<span class="badge sky">EDHREC ${x.edh.inc}%</span>`:""}
    <span class="badge ip">⚡ ${x.ip.toFixed(1)} pt/€</span>
    <span class="badge role">+${x.imp.pts.toFixed(1)} pt</span>
    <span class="price">${eur(x.c.eur)}</span>
    <button class="mini" data-add-buy="${esc(x.c.name)}">➕ au plan</button>
    <span class="reason">→ ${x.imp.why.join(" · ")}</span></div>`).join("")||(BUDGET!==0?`<div class="empty">Rien sous ce budget.</div>`:"")}
  </div>`;
  z.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{BUDGET=+c.dataset.b||(c.dataset.b==="Infinity"?Infinity:+c.dataset.b);if(c.dataset.b==="Infinity")BUDGET=Infinity;tabAchats(A,$("#tabZone"));}));
  bindPlanButtons(A.name,z);
}
function tabCompare(A,z){
  const V=virtualAnalysis(A.name),P=planOf(A.name);
  const planLine=(arr,cls,pref,rm)=>arr.map(n=>`<span class="badge ${cls}">${pref} ${esc(n)} <a href="#" data-rm="${rm}|${esc(n)}" style="text-decoration:none">✕</a></span>`).join(" ");
  const head=`<div class="badges" style="margin-bottom:12px">${planLine(P.addOwned,"free","✨",("own"))}${planLine(P.buys,"owned","🛒","buy")}${planLine(P.cuts,"warn","✂️","cut")}</div>`;
  if(!V){z.innerHTML=`<div class="panel"><h2>⚖️ Avant / Après</h2><div class="empty"><div class="big">🌱</div>Ton plan est vide — ajoute des cartes depuis 🎯 Priorités, ✨ ou 🛒.</div></div>`;return;}
  const sB=A.score.global,sA=V.score.global,d=sA-sB;
  const simB=simulate(A,2500),simA=simulate(V,2500);
  const buys=P.buys.map(n=>NAME_DB[n]).filter(Boolean);const cost=buys.reduce((a,c)=>a+(c.eur||0),0);
  const max=Math.max(...A.curve,...V.curve,1);
  const dd=(b,a,inv)=>{const dl=a-b;const good=inv?dl<0:dl>0;
    return`<span class="delta ${dl===0?"":(good?"up":"down")}">${dl>0?"+":""}${(dl*100).toFixed(1)} pts</span>`;};
  z.innerHTML=`<div class="panel"><h2>⚖️ Avant / Après <span class="sub">ton plan d'optimisation, chiffré</span></h2>${head}
  <div class="compare-grid">
    <div style="text-align:center"><div class="sec-title">Avant</div>
      <div class="donut-score on-light" style="--p:${sB};--col:${scoreColor(sB)};margin:0 auto"><i>${sB}<small>/100</small></i></div></div>
    <div style="text-align:center"><div class="sec-title">Après <span class="delta ${d>=0?"up":"down"}">${d>0?"+":""}${d}</span></div>
      <div class="donut-score on-light" style="--p:${sA};--col:${scoreColor(sA)};margin:0 auto"><i>${sA}<small>/100</small></i></div></div>
  </div>
  <div class="sec-title">Courbe de mana (violet = avant, rose = après)</div>
  <div class="curve">${A.curve.map((v,i)=>`<div class="bar"><div class="pair"><i style="height:${Math.max(2,100*v/max)}%"><b>${v||""}</b></i><i class="after" style="height:${Math.max(2,100*V.curve[i]/max)}%"><b>${V.curve[i]||""}</b></i></div><span class="lbl">${i<7?i:"7+"}</span></div>`).join("")}</div>
  <div class="sec-title">Probabilités (Monte-Carlo, ${simB.iters} mains)</div>
  <div class="kpis">
    <div class="kpi"><div class="v">${pct(1-simA.screw)}</div><div class="l">mains sans screw ${dd(1-simB.screw,1-simA.screw)}</div></div>
    <div class="kpi"><div class="v">${pct(simA.ramp2)}</div><div class="l">ramp T1-T2 ${dd(simB.ramp2,simA.ramp2)}</div></div>
    <div class="kpi"><div class="v">${pct(simA.land3T3)}</div><div class="l">3 terrains à T3 ${dd(simB.land3T3,simA.land3T3)}</div></div>
    <div class="kpi"><div class="v">${pct(simA.cmdT4)}</div><div class="l">commandant T4 ${dd(simB.cmdT4,simA.cmdT4)}</div></div>
    <div class="kpi"><div class="v">${eur(cost)}</div><div class="l">coût du plan</div></div>
  </div>
  <p class="hint">Une fois les échanges faits en vrai (et re-scannés dans ManaBox), réimporte le CSV et le plan pourra être vidé.</p>
  <button class="mini" id="clearPlan">🗑️ Vider le plan</button></div>`;
  z.querySelectorAll("[data-rm]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();
    const[k,n]=a.dataset.rm.split("|");const P=planOf(A.name);
    if(k==="own")P.addOwned=P.addOwned.filter(x=>x!==n);
    if(k==="buy")P.buys=P.buys.filter(x=>x!==n);
    if(k==="cut")P.cuts=P.cuts.filter(x=>x!==n);autoStore();renderDeck(A.name);}));
  $("#clearPlan")?.addEventListener("click",()=>{PLANS[A.name]={addOwned:[],buys:[],cuts:[]};autoStore();renderDeck(A.name);});
}
function tabSim(A,z){
  const s=simulate(A,5000);
  const maxd=Math.max(...s.dist,0.01);
  z.innerHTML=`<div class="panel"><h2>🎰 Simulateur <span class="sub">5 000 parties simulées — mulligans inclus (jusqu'à 2 si ≤1 ou ≥6 terrains)</span></h2>
  <div class="kpis">
    <div class="kpi"><div class="v">${pct(s.rawScrew)}</div><div class="l">screw naturel (avant mulligan)</div></div>
    <div class="kpi"><div class="v">${pct(s.screw)}</div><div class="l">screw après mulligans</div></div>
    <div class="kpi"><div class="v">${s.avgMulls.toFixed(2)}</div><div class="l">mulligans moyens / partie</div></div>
    <div class="kpi"><div class="v">${pct(s.flood)}</div><div class="l">flood gardé (≥5 terrains)</div></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="v">${pct(s.ramp2)}</div><div class="l">ramp jouable T1-T2</div></div>
    <div class="kpi"><div class="v">${pct(s.land3T3)}</div><div class="l">3 poses de terrain à T3</div></div>
    <div class="kpi"><div class="v">${pct(s.cmdT4)}</div><div class="l">${A.commander?esc(A.commander.name.split(",")[0]):"commandant"} posable T4 (coût ${s.cmdCost})</div></div>
  </div>
  <div class="sec-title">Terrains dans la main gardée</div>
  <div class="curve">${s.dist.map((v,i)=>`<div class="bar"><i style="height:${Math.max(2,100*v/maxd)}%;${i>=2&&i<=4?"":"opacity:.45"}"><b>${pct(v)}</b></i><span class="lbl">${i}</span></div>`).join("")}</div>
  <p class="hint">Zone idéale : 2 à 4 terrains. Hypothèses : mulligan = re-pioche de 7 (règle de Londres simplifiée, sans mise en dessous), ramp = sorts/artefacts ≤2 CMC produisant du mana.</p></div>`;
}
function tabParties(A,z){
  const games=GAMES.filter(g=>g.deck===A.name).slice().reverse();
  z.innerHTML=`<div class="panel"><h2>🎲 Suivi des parties <span class="sub">SakuraDeck apprend les points faibles réels du deck</span></h2>
  <div class="form-row">
    <select id="gWin"><option value="1">🏆 Victoire</option><option value="0">💧 Défaite</option></select>
    <input type="number" id="gPlayers" min="2" max="8" value="4" style="width:70px" title="Nombre de joueurs">
    <label style="font-size:.85rem"><input type="checkbox" id="gTHG"> Troll à 2 têtes</label>
    <select id="gReason"><option value="">— raison de la défaite —</option>${Object.entries(DEFEAT_REASONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
  </div>
  <div class="form-row"><input type="text" id="gNotes" placeholder="notes (adversaires, moments clés…)" style="flex:1">
  <button class="primary" id="gAdd">➕ Enregistrer</button></div>
  ${games.length?games.map((g,i)=>`<div class="game-line">${g.win?"🏆":"💧"} ${g.date} · ${g.players} joueurs${g.thg?" · 2HG":""}${g.reason?` · ${esc(DEFEAT_REASONS[g.reason])}`:""}${g.notes?` · <span class="hint">${esc(g.notes)}</span>`:""}</div>`).join(""):`<div class="empty">Aucune partie enregistrée. Pense à 💾 Sauver ma session pour les conserver !</div>`}
  ${gameInsight(A.name)?`<div class="advice" style="background:var(--sky-bg);border-left:4px solid var(--sky);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:.88rem">🔍 ${gameInsight(A.name)}</div>`:""}</div>`;
  $("#gAdd").addEventListener("click",()=>{
    GAMES.push({deck:A.name,date:new Date().toISOString().slice(0,10),win:$("#gWin").value==="1",
      players:+$("#gPlayers").value,thg:$("#gTHG").checked,reason:$("#gReason").value||null,notes:$("#gNotes").value.trim()});
    autoStore();renderDeck(A.name);});
}
function gameInsight(name){
  const losses=GAMES.filter(g=>g.deck===name&&!g.win&&g.reason);
  if(losses.length<2)return null;
  const cnt={};losses.forEach(g=>cnt[g.reason]=(cnt[g.reason]||0)+1);
  const[top,n]=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const cat=REASON_TO_CAT[top];const A=analyzeDeck(name);
  return`${n} défaite${n>1?"s":""} sur ${losses.length} pour « ${DEFEAT_REASONS[top]} » — ça pointe vers <b>${CATS[cat]?.lbl||top}</b>${CATS[cat]?` (sous-score ${Math.round(CATS[cat].w*A.score.subs[cat].r)}/${CATS[cat].w})`:""}. Regarde la priorité correspondante dans 🌸 Aperçu.`;
}
function tabCartes(A,z){
  const byRole={};
  [...A.tagged].sort((a,b)=>a.c.cmc-b.c.cmc||a.c.name.localeCompare(b.c.name))
    .forEach(t=>{const k=t.tg[0]||"Autres sorts";(byRole[k]=byRole[k]||[]).push(t);});
  z.innerHTML=`<div class="panel"><h2>🎴 Cartes <span class="sub">${A.size} cartes · ${eur(A.value)}</span></h2>`+
    Object.entries(byRole).map(([k,list])=>`<div class="sec-title">${k} · ${list.reduce((a,t)=>a+t.e.q,0)}</div>`+
    list.map(t=>`<div class="cardline">${t.c.img?`<img class="thumb" loading="lazy" src="${t.c.img}">`:`<span class="thumb"></span>`}
      <span class="nm">${t.e.q>1?t.e.q+"× ":""}${esc(t.c.name)}${t.c.img?`<img class="zoom" src="${t.c.img}">`:""}</span>
      <span class="type">${esc(t.c.type)}</span>
      ${t.tg.slice(1).map(x=>`<span class="badge role">${x}</span>`).join("")}
      <span class="price">${eur(t.price)}</span></div>`).join("")).join("")+`</div>`;
}
