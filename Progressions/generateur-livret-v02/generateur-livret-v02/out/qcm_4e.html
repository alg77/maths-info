<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QCM 4e — entraînement</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f0fb;color:#4a4458;margin:0;padding:20px}.app{max-width:900px;margin:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 12px 30px #7d54a322}h1{color:#3f78a3}select,button{font:inherit;border-radius:12px;border:1px solid #d8c8e6;padding:9px 12px;margin:4px}button{background:#3f78a3;color:white;border:0;cursor:pointer}.card{border:2px solid #d8c8e6;border-radius:18px;padding:16px;margin-top:18px}.choices{display:grid;gap:10px;margin-top:12px}.choice{background:#faf7fc;border:1px solid #eadff2;border-radius:14px;padding:12px;text-align:left;color:#4a4458}.choice.ok{background:#ecfdf3;border-color:#5fb98c}.choice.bad{background:#fff0f3;border-color:#c0537a}.meta{color:#8a7ea0;font-size:.9em}.exp{margin-top:12px;background:#fff8ea;border-left:5px solid #e6b450;padding:10px;border-radius:12px}.hidden{display:none}</style></head><body><div class="app"><h1>QCM 4e — entraînement</h1><p>Choisis un chapitre, puis réponds aux questions générées depuis les liens MathALÉA.</p><label>Chapitre <select id="chap"></select></label><button id="new">Nouvelle question</button><div id="card" class="card"></div></div><script src="questions.js"></script><script>const QS=(window.QUESTIONS_4EME||[]);const chap=document.getElementById('chap'),card=document.getElementById('card');[...new Set(QS.map(q=>q.chapitre))].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;chap.appendChild(o)});let current=null;function pick(){let arr=QS.filter(q=>q.chapitre===chap.value);current=arr[Math.floor(Math.random()*arr.length)];render()}function render(){if(!current){card.textContent='Aucune question.';return}card.innerHTML=`<div class="meta">${current.chapitre} · ${current.source}</div><h2>${current.question}</h2><div class="choices">${current.choix.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('')}</div><div class="exp hidden"></div>`;card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}function answer(i){let good=current.bonnesReponses.includes(i);card.querySelectorAll('.choice').forEach((b,k)=>{if(current.bonnesReponses.includes(k))b.classList.add('ok');else if(k===i)b.classList.add('bad')});let e=card.querySelector('.exp');e.classList.remove('hidden');e.textContent=(good?'✅ Bravo ! ':'❌ Pas encore. ')+current.explication}document.getElementById('new').onclick=pick;chap.onchange=pick;pick();</script></body></html>
