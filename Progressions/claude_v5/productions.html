<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productions d’élèves</title>
  <style>
    :root{--ink:#4a414a;--muted:#6d5d68;--accent:#d98ba4;--accent-ink:#a8607c;--glass:rgba(255,253,252,.84);--line:rgba(255,255,255,.72);--blue:#315f99;--green:#3d7a50;--violet:#7c3aed}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(rgba(255,248,246,.18),rgba(255,248,246,.38)),url('fond-sakura-maths.png') center top / cover fixed no-repeat}
    body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,248,246,.06),rgba(255,248,246,.36));pointer-events:none;z-index:-1}
    .container{max-width:1100px;margin:0 auto;padding:48px 20px 70px}
    .topbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
    .back-link{color:var(--accent-ink);text-decoration:none;font-weight:bold}
    h1{font-family:Georgia,serif;font-size:clamp(1.9rem,5vw,3rem);margin:0 0 10px;color:#47304f;text-shadow:0 2px 14px rgba(255,255,255,.9)}
    .intro{color:var(--muted);max-width:840px;line-height:1.7;margin:0 0 24px;font-size:1.03rem}
    .filters{display:flex;flex-wrap:wrap;gap:20px;margin:0 0 18px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(10px)}
    .fgroup{display:flex;flex-direction:column;gap:8px}
    .fgroup .lbl{font-size:.72rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#9a8b94}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{border:1px solid rgba(216,139,164,.4);background:rgba(255,255,255,.55);color:var(--accent-ink);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;font:inherit;font-weight:700}
    .chip:hover{background:#fdeef1}
    .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px}
    .count{color:var(--muted);font-size:.92rem}
    .reset{background:none;border:none;color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
    .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
    .pcard{background:var(--glass);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(130,92,112,.13);backdrop-filter:blur(10px);display:flex;flex-direction:column}
    .pthumb{aspect-ratio:4/3;background:linear-gradient(135deg,#fde7ef,#e7eefb);display:flex;align-items:center;justify-content:center;font-size:2.1rem;color:#cfa0b6}
    .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
    .pbody{padding:13px 15px 16px;display:flex;flex-direction:column;gap:8px}
    .pbody h3{font-family:Georgia,serif;margin:0;font-size:1.02rem;color:#47304f}
    .pbody p{margin:0;color:var(--muted);font-size:.87rem;line-height:1.5}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
    .tag{font-size:.71rem;font-weight:800;padding:3px 8px;border-radius:999px;background:#f3e7ef;color:#9a6a86}
    .tag.lvl{background:#dbeafe;color:#315f99}
    .tag.an{background:#e6f4ea;color:#3d7a50}
    .empty{grid-column:1/-1;color:var(--muted);padding:34px;text-align:center;background:var(--glass);border:1px dashed rgba(216,139,164,.4);border-radius:18px}
    footer{text-align:center;color:var(--muted);margin-top:34px;font-size:.92rem;text-shadow:0 1px 10px rgba(255,255,255,.95)}
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="back-link" href="index.html">← Retour à l’accueil</a>
    </div>

    <h1>🎨 Productions d’élèves</h1>
    <p class="intro">Une galerie de réalisations à montrer en classe : on filtre par niveau, par année scolaire et par séquence. Pratique pour ressortir, par exemple, les paper toys de la séquence « Solides » quand on y arrive en 6ᵉ ou 5ᵉ.</p>

    <div class="filters" id="filters"></div>
    <div class="bar">
      <span class="count" id="count"></span>
      <button class="reset" id="reset" type="button">Réinitialiser les filtres</button>
    </div>

    <section class="pgrid" id="grid" aria-live="polite"></section>

    <footer>🌸 Avec passion et bienveillance ♡</footer>
  </main>

  <script>
  /* ============================================================
     POUR AJOUTER UNE PRODUCTION :
     - duplique un objet ci-dessous dans le tableau ITEMS
     - niveau : '6e' | '5e' | '4e' | '1ère NSI' | 'Terminale NSI' …
     - annee  : '2024-2025' (année scolaire)
     - tags   : liste de séquences/thèmes ['Solides','Paper toys']
     - img    : chemin de la photo, ex 'productions/paper-toys-6e.jpg'
                (mets tes photos dans un sous-dossier 'productions/')
                laisse '' pour afficher une vignette par défaut
     Les filtres (niveau / année / séquence) se construisent
     automatiquement à partir des données. Aucune autre manip.
     ============================================================ */
  var ITEMS=[
    {niveau:'6e', annee:'2024-2025', tags:['Solides','Paper toys'], titre:'Paper toys — pavé droit & cube', desc:'Patrons construits puis décorés en fin de séquence Solides.', img:''},
    {niveau:'5e', annee:'2024-2025', tags:['Solides','Prismes','Paper toys'], titre:'Prismes en papier', desc:'Réalisation de prismes droits à partir de patrons, séquence Solides.', img:''},
    {niveau:'6e', annee:'2023-2024', tags:['Symétrie','Arts'], titre:'Frises & rosaces', desc:'Compositions par symétrie axiale, exposées en classe.', img:''},
    {niveau:'4e', annee:'2024-2025', tags:['Algorithmique','Scratch'], titre:'Mini-jeux Scratch', desc:'Projets de fin de séquence algorithmique (déplacements, scores).', img:''},
    {niveau:'1ère NSI', annee:'2024-2025', tags:['Web','Projet'], titre:'Sites web responsives', desc:'Projets HTML/CSS du chapitre Web, présentés à la classe.', img:''}
  ];

  var ORDER_LVL=['6e','5e','4e','3e','2nde','1ère NSI','Terminale NSI'];
  var state={niveau:new Set(), annee:new Set(), tag:new Set()};

  function uniq(key, split){
    var s=new Set();
    ITEMS.forEach(function(it){ if(split){ it[key].forEach(function(v){s.add(v);}); } else { s.add(it[key]); } });
    return Array.from(s);
  }
  function sortLevels(a,b){ var ia=ORDER_LVL.indexOf(a), ib=ORDER_LVL.indexOf(b); if(ia<0)ia=99; if(ib<0)ib=99; return ia-ib || a.localeCompare(b); }

  function buildFilters(){
    var box=document.getElementById('filters'); box.innerHTML='';
    var groups=[
      {key:'niveau', lbl:'Niveau', vals:uniq('niveau',false).sort(sortLevels)},
      {key:'annee',  lbl:'Année scolaire', vals:uniq('annee',false).sort().reverse()},
      {key:'tag',    lbl:'Séquence / thème', vals:uniq('tags',true).sort()}
    ];
    groups.forEach(function(g){
      var wrap=document.createElement('div'); wrap.className='fgroup';
      var lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=g.lbl; wrap.appendChild(lbl);
      var chips=document.createElement('div'); chips.className='chips';
      g.vals.forEach(function(v){
        var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=v;
        b.setAttribute('aria-pressed','false');
        b.addEventListener('click',function(){
          if(state[g.key].has(v)){ state[g.key].delete(v); b.classList.remove('on'); b.setAttribute('aria-pressed','false'); }
          else { state[g.key].add(v); b.classList.add('on'); b.setAttribute('aria-pressed','true'); }
          render();
        });
        chips.appendChild(b);
      });
      wrap.appendChild(chips); box.appendChild(wrap);
    });
  }

  function matches(it){
    var okN=state.niveau.size===0 || state.niveau.has(it.niveau);
    var okA=state.annee.size===0 || state.annee.has(it.annee);
    var okT=state.tag.size===0 || it.tags.some(function(t){return state.tag.has(t);});
    return okN && okA && okT;
  }

  function render(){
    var grid=document.getElementById('grid'); grid.innerHTML='';
    var shown=ITEMS.filter(matches);
    document.getElementById('count').textContent=shown.length+(shown.length>1?' productions':' production')+' affichée'+(shown.length>1?'s':'');
    if(shown.length===0){ var e=document.createElement('div'); e.className='empty'; e.textContent='Aucune production ne correspond à ces filtres.'; grid.appendChild(e); return; }
    shown.forEach(function(it){
      var c=document.createElement('article'); c.className='pcard';
      var th=document.createElement('div'); th.className='pthumb';
      if(it.img){ var im=document.createElement('img'); im.src=it.img; im.alt=it.titre; im.loading='lazy'; im.onerror=function(){ th.textContent='🖼️'; }; th.appendChild(im); }
      else { th.textContent='🖼️'; }
      c.appendChild(th);
      var b=document.createElement('div'); b.className='pbody';
      var h=document.createElement('h3'); h.textContent=it.titre; b.appendChild(h);
      if(it.desc){ var p=document.createElement('p'); p.textContent=it.desc; b.appendChild(p); }
      var meta=document.createElement('div'); meta.className='meta';
      var ln=document.createElement('span'); ln.className='tag lvl'; ln.textContent=it.niveau; meta.appendChild(ln);
      var an=document.createElement('span'); an.className='tag an'; an.textContent=it.annee; meta.appendChild(an);
      it.tags.forEach(function(t){ var tg=document.createElement('span'); tg.className='tag'; tg.textContent=t; meta.appendChild(tg); });
      b.appendChild(meta); c.appendChild(b); grid.appendChild(c);
    });
  }

  document.getElementById('reset').addEventListener('click',function(){
    state.niveau.clear(); state.annee.clear(); state.tag.clear();
    document.querySelectorAll('.chip.on').forEach(function(b){ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); });
    render();
  });

  buildFilters(); render();
  </script>
</body>
</html>
