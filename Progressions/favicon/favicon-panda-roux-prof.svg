<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Panda roux prof kawaii">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a32"/>
      <stop offset="1" stop-color="#d95722"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="1" stop-color="#ffe6bb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7a2f1d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- ears -->
    <path d="M25 35 C20 16 33 8 47 26 L39 50 Z" fill="#6b2f22"/>
    <path d="M103 35 C108 16 95 8 81 26 L89 50 Z" fill="#6b2f22"/>
    <path d="M30 34 C28 22 35 17 44 29 L38 43 Z" fill="url(#cream)"/>
    <path d="M98 34 C100 22 93 17 84 29 L90 43 Z" fill="url(#cream)"/>

    <!-- face silhouette -->
    <path d="M23 55 C20 34 38 20 64 20 C90 20 108 34 105 55 C114 76 101 105 64 109 C27 105 14 76 23 55 Z" fill="#6b2f22"/>
    <path d="M29 55 C27 37 42 26 64 26 C86 26 101 37 99 55 C106 76 94 98 64 101 C34 98 22 76 29 55 Z" fill="url(#fur)"/>

    <!-- cheeks -->
    <path d="M28 70 C35 57 45 54 57 63 C50 83 39 90 26 85 C23 80 24 75 28 70 Z" fill="url(#cream)"/>
    <path d="M100 70 C93 57 83 54 71 63 C78 83 89 90 102 85 C105 80 104 75 100 70 Z" fill="url(#cream)"/>
    <path d="M49 70 C54 64 74 64 79 70 C80 90 72 100 64 100 C56 100 48 90 49 70 Z" fill="url(#cream)"/>

    <!-- eyebrow marks -->
    <ellipse cx="48" cy="45" rx="11" ry="6" fill="#fff2cf" transform="rotate(-12 48 45)"/>
    <ellipse cx="80" cy="45" rx="11" ry="6" fill="#fff2cf" transform="rotate(12 80 45)"/>

    <!-- glasses -->
    <circle cx="48" cy="65" r="14" fill="none" stroke="#4b241b" stroke-width="5"/>
    <circle cx="80" cy="65" r="14" fill="none" stroke="#4b241b" stroke-width="5"/>
    <path d="M62 65 Q64 63 66 65" fill="none" stroke="#4b241b" stroke-width="4" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="48" cy="65" r="8" fill="#3b1d16"/>
    <circle cx="80" cy="65" r="8" fill="#3b1d16"/>
    <circle cx="51" cy="61" r="3" fill="#fff"/>
    <circle cx="83" cy="61" r="3" fill="#fff"/>

    <!-- blush -->
    <ellipse cx="36" cy="79" rx="8" ry="4" fill="#ff9db3" opacity="0.7"/>
    <ellipse cx="92" cy="79" rx="8" ry="4" fill="#ff9db3" opacity="0.7"/>

    <!-- nose and mouth -->
    <ellipse cx="64" cy="77" rx="6" ry="4.5" fill="#4b241b"/>
    <path d="M64 81 C61 85 57 86 55 82" fill="none" stroke="#4b241b" stroke-width="3" stroke-linecap="round"/>
    <path d="M64 81 C67 85 71 86 73 82" fill="none" stroke="#4b241b" stroke-width="3" stroke-linecap="round"/>

    <!-- bow -->
    <circle cx="64" cy="24" r="5" fill="#f58aa5" stroke="#8a3c4e" stroke-width="2"/>
    <path d="M59 24 C48 15 43 17 45 27 C47 36 55 32 64 24 Z" fill="#ff9db3" stroke="#8a3c4e" stroke-width="2"/>
    <path d="M69 24 C80 15 85 17 83 27 C81 36 73 32 64 24 Z" fill="#ff9db3" stroke="#8a3c4e" stroke-width="2"/>

    <!-- sakura flower -->
    <g transform="translate(91 42) scale(.75)">
      <circle cx="0" cy="0" r="3" fill="#f2a13b"/>
      <path d="M0 -4 C-7 -14 7 -14 0 -4Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="1.5"/>
      <path d="M4 -1 C16 -6 12 8 4 -1Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="1.5"/>
      <path d="M2 4 C9 14 -5 14 2 4Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="1.5"/>
      <path d="M-3 3 C-15 8 -12 -6 -3 3Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="1.5"/>
      <path d="M-4 -1 C-12 -11 -16 4 -4 -1Z" fill="#ffc4d2" stroke="#d98ba4" stroke-width="1.5"/>
    </g>
  </g>
</svg>
