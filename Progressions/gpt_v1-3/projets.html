<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projets &amp; événements</title>
  <link rel="stylesheet" href="site-commun.css">
  <style>
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
    .chip{border:1px solid rgba(216,139,164,.4);background:rgba(255,255,255,.55);color:var(--accent-ink);border-radius:999px;padding:6px 13px;font-size:.86rem;cursor:pointer;font:inherit;font-weight:700}
    .chip:hover{background:#fdeef1}
    .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .pjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
    .pj{background:var(--glass);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(130,92,112,.14);backdrop-filter:blur(10px);display:flex;flex-direction:column}
    .pjthumb{aspect-ratio:16/9;background:linear-gradient(135deg,#fde7ef,#e7eefb);display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:#cfa0b6;position:relative}
    .pjthumb img{width:100%;height:100%;object-fit:cover;display:block}
    .pjdate{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.85);color:var(--accent-ink);font-weight:800;font-size:.76rem;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
    .pjbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px}
    .pjbody h3{font-family:Georgia,serif;margin:0;font-size:1.18rem;color:#47304f}
    .pjbody .who{font-size:.82rem;color:#9a8b94;font-weight:700}
    .pjbody p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.6}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
    .tag{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;background:#ede9fe;color:#6f42a6}
    .draft{align-self:flex-start;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9b5b00;background:#fff3da;padding:3px 8px;border-radius:999px}
  </style>
</head>
<body data-page="projets" data-zone="prof">
  <main class="container">
    <h1>🚀 Projets &amp; événements</h1>
    <p class="intro">Les temps forts de l’année : concours, nuits du code, projets pluridisciplinaires et clubs. De courts récits et quelques photos, pour donner à voir la dynamique de classe — sans publier les cours eux-mêmes.</p>

    <div class="chips" id="years" aria-label="Filtrer par année scolaire"></div>
    <section class="pjgrid" id="grid" aria-live="polite"></section>
  </main>

  <script src="site.js" defer></script>
  <script>
  /* ============================================================
     POUR AJOUTER UN PROJET : duplique un objet dans PROJETS.
     - annee : année scolaire ('2025-2026')
     - date  : libellé court affiché sur la photo ('21 mai 2026')
     - who   : public / participants ('Collège · ~20 élèves')
     - tags  : mots-clés ['Nuit du Code','Pyxel']
     - img   : 'projets/nuit-du-code-2026.jpg'  (dossier 'projets/'),
               ou '' pour une vignette par défaut
     - draft : true affiche un badge « brouillon » (à retirer une
               fois mon texte validé)
     Les textes ci-dessous sont des brouillons à personnaliser.
     ============================================================ */
  var PROJETS=[
    {
      annee:'2025-2026', date:'21 mai 2026', titre:'Nuit du Code — 2ᵉ édition',
      who:'Collège · ~20 élèves · 4 mentors anciens élèves',
      desc:'Deuxième édition sur le thème d’un Tower Defense réalisé avec Pyxel : une soirée de création de jeux en Python, encadrée par d’anciens élèves devenus mentors et un collègue astrophysicien. Pixel art, entraide et beaucoup d’énergie.',
      tags:['Nuit du Code','Pyxel','Python','Pixel art'], img:'', draft:true
    },
    {
      annee:'2025-2026', date:'Printemps 2026', titre:'Algoréa — qualifications',
      who:'Lycée · 1ʳᵉ NSI',
      desc:'Trois élèves de Première NSI qualifiés pour les quarts de finale du concours d’algorithmique Algoréa. Un bel indicateur de la montée en compétences sur la résolution de problèmes.',
      tags:['Algoréa','Concours','Algorithmique','NSI'], img:'', draft:true
    },
    {
      annee:'2025-2026', date:'Année 2025-2026', titre:'Club Sciences, Numérique & Jeux',
      who:'Collège · co-animé (SVT, physique-chimie, maths/NSI)',
      desc:'Projet du Pacte : programmation de jeux avec Scratch par niveau, projets de sciences connectées (micro:bit) et échecs. Une équipe 100 % féminine en sciences, pensée comme un atout pour la mixité en STEM.',
      tags:['Club','Pacte','Scratch','micro:bit'], img:'', draft:true
    },
    {
      annee:'2024-2025', date:'À compléter', titre:'Trophées NSI',
      who:'Lycée · NSI',
      desc:'À personnaliser : présentation de ma participation ou de mon projet de classe pour les Trophées NSI (équipe, sujet, ce que les élèves en ont retiré).',
      tags:['Trophées NSI','Projet'], img:'', draft:true
    }
  ];

  var state=new Set();

  function years(){
    var s=new Set(); PROJETS.forEach(function(p){ s.add(p.annee); });
    return Array.from(s).sort().reverse();
  }
  function buildYears(){
    var box=document.getElementById('years'); box.innerHTML='';
    years().forEach(function(y){
      var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=y; b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){
        if(state.has(y)){ state.delete(y); b.classList.remove('on'); b.setAttribute('aria-pressed','false'); }
        else { state.add(y); b.classList.add('on'); b.setAttribute('aria-pressed','true'); }
        render();
      });
      box.appendChild(b);
    });
  }
  function render(){
    var grid=document.getElementById('grid'); grid.innerHTML='';
    var shown=PROJETS.filter(function(p){ return state.size===0 || state.has(p.annee); });
    shown.forEach(function(p){
      var c=document.createElement('article'); c.className='pj';
      var th=document.createElement('div'); th.className='pjthumb';
      if(p.img){ var im=document.createElement('img'); im.src=p.img; im.alt=p.titre; im.loading='lazy'; im.onerror=function(){ th.firstChild&&th.removeChild(th.firstChild); th.appendChild(document.createTextNode('📸')); }; th.appendChild(im); }
      else { th.appendChild(document.createTextNode('📸')); }
      if(p.date){ var d=document.createElement('span'); d.className='pjdate'; d.textContent=p.date; th.appendChild(d); }
      c.appendChild(th);
      var b=document.createElement('div'); b.className='pjbody';
      if(p.draft){ var dr=document.createElement('span'); dr.className='draft'; dr.textContent='brouillon'; b.appendChild(dr); }
      var h=document.createElement('h3'); h.textContent=p.titre; b.appendChild(h);
      if(p.who){ var w=document.createElement('span'); w.className='who'; w.textContent=p.who; b.appendChild(w); }
      if(p.desc){ var pp=document.createElement('p'); pp.textContent=p.desc; b.appendChild(pp); }
      var meta=document.createElement('div'); meta.className='meta';
      (p.tags||[]).forEach(function(t){ var tg=document.createElement('span'); tg.className='tag'; tg.textContent=t; meta.appendChild(tg); });
      b.appendChild(meta); c.appendChild(b); grid.appendChild(c);
    });
  }
  buildYears(); render();
  </script>
</body>
</html>
